<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>訂單明細</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h2>🧾 訂單明細</h2>

    <div th:if="${order != null}">
        <p>訂單編號：<span th:text="${order.ticketOrderId}">1001</span></p>
        <p>訂單金額：<span th:text="${order.orderPrice}">3000</span> 元</p>
        <p>狀態：
            <span th:switch="${order.orderStatus}">
                <span th:case="0" class="text-warning">待付款</span>
                <span th:case="1" class="text-success">已付款</span>
                <span th:case="2" class="text-danger">已取消</span>
                <span th:case="*">未知</span>
            </span>
        </p>
        <p>【DEBUG】下單時間原始值：<span th:text="${order.orderDatetime}">時間</span></p>
        <p th:if="${order.orderDatetime != null}">
		    下單時間：
		    <span th:text="${#temporals.format(order.orderDatetime, 'yyyy/MM/dd HH:mm')}"></span>

		</p>
		
		<p th:if="${order.orderDatetime == null}" class="text-muted">
		    下單時間：資料尚未提供
		</p>



    </div>

    <hr>

    <div th:if="${#lists.isEmpty(receipts)}">
        <p class="text-muted">此訂單尚無票券明細。</p>
    </div>

    <div th:each="receipt : ${receipts}" class="mb-4 border p-3 rounded">
        <h5>票券資訊</h5>

        <!-- 圖片 -->
        <div th:if="${ticketImageMap[receipt.ticketOrderReceiptId] != null}">
            <img th:src="'data:image/jpeg;base64,' + ${ticketImageMap[receipt.ticketOrderReceiptId]}" style="max-width: 200px;" alt="票券圖片" />
        </div>
        <div th:if="${ticketImageMap[receipt.ticketOrderReceiptId]} == null">
            <p class="text-muted">尚無圖片</p>
        </div>

        <!-- 票券名稱 -->
        <p>
            票券名稱：
            <span th:if="${ticketMap[receipt.ticketOrderReceiptId] != null}"
			      th:text="${ticketMap[receipt.ticketOrderReceiptId].ticketName}">
			    票券名稱
			</span>

        </p>
    </div>

    <a th:href="@{/member/detail/ticket/orders}" class="btn btn-secondary">← 返回訂單列表</a>

</body>
</html>
