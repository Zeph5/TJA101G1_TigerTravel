<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員資料編輯 - 臺鴿旅遊</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff; /* 淡藍背景，清新如藍天 */
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #007bff;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        .preview {
            max-width: 200px;
            margin-top: 10px;
            border-radius: 50%;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>會員資料編輯</h1>
        <form th:action="@{/member/edit}" th:object="${member}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>姓名：</label>
                <input type="text" th:field="*{memberName}" required />
            </div>
            <div class="form-group">
                <label>Email：</label>
                <input type="email" th:field="*{memberEmail}" required />
            </div>
            <div class="form-group">
                <label>電話：</label>
                <input type="tel" th:field="*{memberPhone}" />
            </div>
            <div class="form-group">
                <label>地址：</label>
                <input type="text" th:field="*{memberAddress}" />
            </div>
            <div class="form-group">
                <label>上傳新頭像：</label>
                <input type="file" name="avatarFile" onchange="previewImage(this)" />
                <img id="preview" class="preview" th:if="${member.avatar != null}" th:src="'data:image/jpeg;base64,' + ${avatarPreview}" alt="頭像預覽" />
            </div>
            <button type="submit">儲存</button>
        </form>
        <div class="links">
            <a href="/index">回首頁</a>
        </div>
    </div>

    <script>
        function previewImage(input) {
            const preview = document.getElementById('preview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
