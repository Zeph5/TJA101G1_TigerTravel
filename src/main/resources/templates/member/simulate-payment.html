<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>模擬信用卡支付</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="text-center mb-4 text-primary"><i class="bi bi-credit-card-fill"></i> 模擬信用卡支付</h2>

        <!-- 新增：顯示旅程訂單資訊 -->
        <div th:if="${order != null}" class="card shadow-sm mb-4">
            <div class="card-body">
                <h3 class="card-title text-success">訂單資訊</h3>
                <p class="card-text"><strong>行程標題：</strong> <span th:text="${order.travelItinerary.travelPlan.travelTitle}"></span></p>
                <p class="card-text"><strong>出發日期：</strong> <span th:text="${order.travelItinerary.startDate}"></span></p>
                <p class="card-text"><strong>結束日期：</strong> <span th:text="${order.travelItinerary.endDate}"></span></p>
                <p class="card-text"><strong>人數：</strong> <span th:text="${order.peopleCount}"></span> 人</p>
                <p class="card-text"><strong>單人價格：</strong> <span th:text="${order.tourPrice}"></span> 元</p>
                <p class="card-text"><strong>總金額：</strong> <span th:text="${order.totalAmount}"></span> 元 (計算：單價 <span th:text="${order.tourPrice}"></span> * 人數 <span th:text="${order.peopleCount}"></span>)</p>
            </div>
        </div>
        <div th:if="${order == null}" class="alert alert-warning text-center mb-4">
            <i class="bi bi-exclamation-triangle-fill"></i> ⚠️ 無法載入訂單資訊，請檢查訂單 ID！
        </div>

        <!-- 錯誤訊息顯示 -->
        <div th:if="${error}" class="alert alert-danger text-center mb-4">
            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
        </div>

        <!-- 支付表單，包成card -->
        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="@{/member/simulate-payment}" method="post">
				    <!-- CSRF 安全驗證 -->
				    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				
				    <!-- 隱藏訂單ID -->
				    <input type="hidden" name="orderId" th:value="${orderId}" />
				    <!-- 隱藏組合到期日 -->
				    <input type="hidden" name="expiryDate" id="expiryDate" />
				
				    <div class="mb-3 input-group">
					    <span class="input-group-text"><i class="bi bi-credit-card"></i></span>
					    <input type="text" name="cardNumber" class="form-control" placeholder="請輸入 16 位數信用卡號 (以 3~6 開頭)" required />
					</div>
					
					<div class="mb-3 input-group">
					    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
					    <input type="password" name="cvv" class="form-control" placeholder="請輸入 3 位數安全碼 (CVV)" required />
					</div>

				
				    <div class="mb-3 input-group">
				        <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
				        <select id="expiryMonth" class="form-select" required>
				            <option value="">月份</option>
				            <th:block th:each="m : ${#numbers.sequence(1, 12)}">
				                <option th:value="${#numbers.formatInteger(m, 2)}" th:text="${#numbers.formatInteger(m, 2)}"></option>
				            </th:block>
				        </select>
				        <span class="input-group-text">/</span>
				        <select id="expiryYear" class="form-select" required>
				            <option value="">年份</option>
				            <th:block th:each="y : ${#numbers.sequence(#calendars.year(#calendars.createNow()), #calendars.year(#calendars.createNow()) + 10)}">
				                <option th:value="${y % 100}" th:text="${y}"></option>
				            </th:block>
				        </select>
				    </div>
				
				    <button type="submit" class="btn btn-success btn-lg w-100"><i class="bi bi-check-circle-fill"></i> 確認支付</button>
				</form>

            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/member/orders" class="btn btn-secondary"><i class="bi bi-arrow-left-circle"></i> 返回訂單列表</a>
        </div>
    </div>

    <script>
        const expiryMonth = document.getElementById('expiryMonth');
        const expiryYear = document.getElementById('expiryYear');
        const expiryDateHidden = document.getElementById('expiryDate');

        function updateExpiryDate() {
            const month = expiryMonth.value;
            const year = expiryYear.value;
            if (month && year) {
                expiryDateHidden.value = month + '/' + year; // 組合 ex: 12/25
            } else {
                expiryDateHidden.value = ''; // 清空防錯
            }
        }

        expiryMonth.addEventListener('change', updateExpiryDate);
        expiryYear.addEventListener('change', updateExpiryDate);
    </script>

</body>
</html>
