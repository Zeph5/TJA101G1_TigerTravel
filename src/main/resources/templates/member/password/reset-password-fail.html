<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>重設失敗</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <script th:inline="javascript" th:if="${error != null}">
        Swal.fire({
            icon: 'error',
            title: '重設失敗',
            text: "[[${error}]]"
        });
    </script>
</body>
</html>
