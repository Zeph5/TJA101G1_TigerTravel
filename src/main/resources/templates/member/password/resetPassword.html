
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>重設密碼 - TigerTravel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
    <h2 class="mb-4">🔐 重設密碼</h2>
    
    <p class="text-muted">
	    您的帳號：<strong th:text="${maskedAccount}">test****</strong>
	</p>
    
    <form th:action="@{/member/resetPassword}" method="post">
        <input type="hidden" name="token" th:value="${token}" />

        <div class="mb-3">
            <label for="newPassword" class="form-label">新密碼</label>
            <input type="password" class="form-control" id="newPassword" name="newPassword" required>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">確認新密碼</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
        </div>

        <button type="submit" class="btn btn-success">確認重設</button>
    </form>

    <div class="mt-3">
        <p class="text-danger" th:if="${error}" th:text="${error}"></p>
    </div>
    
    <!-- SweetAlert2 -->
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	
	<script th:inline="javascript" th:if="${msg != null}">
	    Swal.fire({
	        icon: 'success',
	        title: '密碼重設成功',
	        text: "[[${msg}]]",
	        timer: 2000,
	        showConfirmButton: false
	    }).then(() => {
	        window.location.href = '/login';
	    });
	</script>
	
	<script th:inline="javascript" th:if="${error != null}">
	    Swal.fire({
	        icon: 'error',
	        title: '錯誤',
	        text: "[[${error}]]"
	    });
	</script>

	    
</body>
</html>
