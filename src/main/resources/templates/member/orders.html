<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的訂單</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h2 class="mb-4 text-center">🧾 我的訂單</h2>

    <!-- 切換按鈕 -->
    <div class="d-flex justify-content-center mb-4">
        <button class="btn btn-outline-primary me-2" onclick="showTab('ticket')">🎫 票券訂單</button>
        <button class="btn btn-outline-success" onclick="showTab('tour')">🧳 旅程訂單</button>
    </div>
    <div class="text-center mt-5">
	    <a th:href="@{/index}" class="btn btn-secondary">🔙 回首頁</a>
	</div>
    

    <!-- ✅ 票券訂單 -->
    <div id="ticketTab" style="display: block;">
        <h4 class="mb-3">票券訂單</h4>

        <div class="text-muted" th:if="${ticketOrders != null and #lists.isEmpty(ticketOrders)}">
            尚無票券訂單。
        </div>

        <div class="table-responsive" th:if="${ticketOrders != null and !#lists.isEmpty(ticketOrders)}">
            <table class="table table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>訂單編號</th>
                        <th>票券資訊</th>
                        <th>訂單金額</th>
                        <th>訂單狀態</th>
                        <th>下單時間</th>
                        <th>功能</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${ticketOrders}">
                        <td th:text="${order.ticketOrderId}">1001</td>
                        
                        <td>
						    <div th:if="${receiptMap != null and receiptMap[order.ticketOrderId] != null}">
						        <div th:each="receipt : ${receiptMap[order.ticketOrderId]}">
						            <div>
						
						                <!-- 🖼️ 圖片顯示 -->
										<div th:if="${receiptImageMap != null and receiptImageMap[receipt.ticketOrderReceiptId] != null}">
										    <img th:src="'data:image/jpeg;base64,' + ${receiptImageMap[receipt.ticketOrderReceiptId]}"
										         alt="票券圖片" style="width:200px;" />
										</div>
										<div th:if="${receiptImageMap == null or receiptImageMap[receipt.ticketOrderReceiptId] == null}">
										    <span class="text-muted">尚無圖片</span>
										</div>


						
						                <!-- ✅ 名稱 -->
						                <span th:with="ticket=${ticketMap[receipt.ticketOrderReceiptId]}"
 										   	  th:text="${ticket != null ? ticket.ticketName : '未命名票券'}"></span>

						                <br><br>
						            </div>
						        </div>
						    </div>
						</td>





                        <td th:text="${order.orderPrice + ' 元'}">3000 元</td>
                        <td>
                            <span th:switch="${order.orderStatus}">
                                <span th:case="0" class="text-warning">待付款</span>
                                <span th:case="1" class="text-success">已付款</span>
                                <span th:case="2" class="text-danger">已取消</span>
                                <span th:case="*">未知</span>
                            </span>
                        </td>
                        <td th:text="${order.orderDatetime != null ? #temporals.format(order.orderDatetime, 'yyyy/MM/dd HH:mm') : '-'}"></td>
                        <td>
						    <a th:href="@{'/member/detail/order/' + ${order.ticketOrderId}}"
						       class="btn btn-sm btn-outline-primary">查看明細</a>
						</td>

                        
                        
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ✅ 旅程訂單 -->
    <div id="tourTab" style="display: none;">
        <h4 class="mb-3">旅程訂單</h4>

        <div class="text-muted" th:if="${tourOrders != null and #lists.isEmpty(tourOrders)}">
            目前尚無旅程訂單。
        </div>

        <div class="table-responsive" th:if="${tourOrders != null and !#lists.isEmpty(tourOrders)}">
            <table class="table table-bordered align-middle">
                <thead class="table-light">
				    <tr>
				        <th>訂單編號</th>
				        <th>旅程標題</th>
				        <th>旅程圖片</th>
				        <th>出發日期</th>
				        <th>結束日期</th> <!-- 加這 -->
				        <th>人數</th>
				        <th>總金額</th>
				        <th>訂單狀態</th>
				        <th>功能</th>
				    </tr>
				</thead>
				<tbody>
				    <tr th:each="tour : ${tourOrders}">
				        <td th:text="${tour.tourOrderId}"></td>
				        <td th:text="${tour.travelItinerary.travelPlan.travelTitle}"></td>
				        
				        <!-- 旅程圖片，從banner URL -->
				        <td>
				            <div th:if="${tour.travelItinerary != null and tour.travelItinerary.travelPlan != null and tour.travelItinerary.travelPlan.travelPlanBannerUrl != null}">
				                <img th:src="${tour.travelItinerary.travelPlan.travelPlanBannerUrl}" alt="旅程圖片" style="width:200px;" />
				            </div>
				            <div th:if="${tour.travelItinerary == null or tour.travelItinerary.travelPlan == null or tour.travelItinerary.travelPlan.travelPlanBannerUrl == null}">
				                <span class="text-muted">尚無圖片</span>
				            </div>
				        </td>
				        
				        <td th:text="${tour.travelItinerary.startDate != null ? #temporals.format(tour.travelItinerary.startDate, 'yyyy-MM-dd') : '-'}"></td>
				        <td th:text="${tour.travelItinerary.endDate != null ? #temporals.format(tour.travelItinerary.endDate, 'yyyy-MM-dd') : '-'}"></td> <!-- 加這 -->
				        <td th:text="${tour.peopleCount}"></td>
				        <td th:text="${tour.totalAmount + ' 元'}"></td>
				
				        <td>
				            <span th:switch="${tour.tourOrderStatus}"> <!-- 改tour不是order -->
				                <span th:case="待付款" class="text-warning">待付款</span> <!-- 你的case用文字 -->
				                <span th:case="已付款" class="text-success">已付款</span>
				                <span th:case="已取消" class="text-danger">已取消</span>
				                <span th:case="*" >未知</span>
				            </span>
				        </td>
				
				        <td>
						    <a th:href="@{'/member/tour-order/detail/' + ${tour.tourOrderId}}" 
						       class="btn btn-sm btn-outline-primary">查看明細</a>
						
						    <a th:if="${tour.tourOrderStatus == '待付款'}"
						       th:href="@{'/member/simulate-payment?orderId=' + ${tour.tourOrderId}}"
						       class="btn btn-sm btn-warning ms-2">繼續付款</a>
						</td>


				    </tr>
				</tbody>
            </table>
        </div>
    </div>

    <!-- 切換 JS -->
    <script>
        function showTab(tab) {
            document.getElementById('ticketTab').style.display = (tab === 'ticket') ? 'block' : 'none';
            document.getElementById('tourTab').style.display = (tab === 'tour') ? 'block' : 'none';
        }
    </script>

</body>
</html>
