<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>訂購旅程</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="mb-4 text-primary">訂購旅程</h2>

    <form action="/member/tour-order/create" method="post">
        <!-- 隱藏旅行ID -->
        <input type="hidden" name="travelItineraryId" th:value="${itinerary.travelItineraryId}" />

        <div class="mb-3">
            <label for="peopleCount" class="form-label">人數：</label>
            <input type="number" name="peopleCount" id="peopleCount" class="form-control" min="1" max="10" required />
            <small class="form-text text-muted">請輸入 1-10 人</small>
        </div>

        <!-- 動態旅客容器 -->
        <div id="touristsContainer" class="mb-3"></div>

        <button type="submit" class="btn btn-primary">提交訂單</button>
    </form>

    <div class="mt-4">
        <a href="/member/travel/list" class="btn btn-secondary">返回訂單列表</a>
    </div>

    <script>
        const peopleCountInput = document.getElementById('peopleCount');
        const touristsContainer = document.getElementById('touristsContainer');

        peopleCountInput.addEventListener('input', function() {
            const count = parseInt(this.value) || 0;
            touristsContainer.innerHTML = ''; // 清空舊欄位

            for (let i = 0; i < count; i++) {
                const touristDiv = document.createElement('div');
                touristDiv.className = 'mb-3';
                touristDiv.innerHTML = `
                    <h5>旅客 ${i + 1}</h5>
                    <input type="text" name="touristName${i}" placeholder="姓名" class="form-control mb-2" required />
                    <input type="text" name="touristPersonalId${i}" placeholder="身分證" class="form-control mb-2" required />
                    <input type="text" name="contactNumber${i}" placeholder="連絡電話" class="form-control" required />
                `;
                touristsContainer.appendChild(touristDiv);
            }
        });
    </script>
</body>
</html>
