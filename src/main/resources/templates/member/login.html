<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>會員登入</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 背景輪播容器 */
        .bg-carousel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .bg-slide.active {
            opacity: 1;
        }

        .bg-slide:nth-child(1) { background-image: url('/images/loginbackground/login1.JPG'); }
        .bg-slide:nth-child(2) { background-image: url('/images/loginbackground/login2.JPG'); }
        .bg-slide:nth-child(3) { background-image: url('/images/loginbackground/login3.JPG'); }
        .bg-slide:nth-child(4) { background-image: url('/images/loginbackground/login4.JPG'); }
        .bg-slide:nth-child(5) { background-image: url('/images/loginbackground/login5.JPG'); }

        /* 遮罩層 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        /* 主要容器 */
        .main-container {
            position: relative;
            z-index: 2;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: flex-end;
            padding: 0 5%;
        }

        /* 登入表單容器 */
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 380px;
            margin-right: 8%;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* LOGO 樣式 */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-container img {
            max-width: 220px;
            height: auto;
            margin-bottom: 10px;
        }

        h1 {
            color: #4B3E2A;
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.8rem;
        }

        form {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffd36f;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #ffbe00;
            box-shadow: 0 0 0 3px rgba(255, 190, 0, 0.2);
        }

        button {
            margin-top: 20px;
            width: 100%;
            background: linear-gradient(135deg, #ffbe00, #f5a300);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        button:hover {
            background: linear-gradient(135deg, #f5a300, #e6930a);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 190, 0, 0.4);
        }

        .links {
            text-align: center;
            margin-top: 15px;
        }

        .links p {
            margin: 10px 0;
            font-size: 0.95rem;
            color: #333;
        }

        .links a {
            color: #d35400;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #e67e22;
            text-decoration: underline;
        }

        /* 輪播指示器 */
        .carousel-indicators {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 3;
        }

        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: background 0.3s;
        }

        .indicator.active {
            background: rgba(255, 255, 255, 0.9);
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .main-container {
                justify-content: center;
                padding: 20px;
            }
            
            .login-container {
                width: 90%;
                max-width: 400px;
                margin-right: 0;
            }

            .logo-container img {
                max-width: 170px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景輪播 -->
    <div class="bg-carousel">
        <div class="bg-slide active"></div>
        <div class="bg-slide"></div>
        <div class="bg-slide"></div>
        <div class="bg-slide"></div>
        <div class="bg-slide"></div>
    </div>

    <!-- 遮罩層 -->
    <div class="overlay"></div>

    <!-- 主要容器 -->
    <div class="main-container">
        <div class="login-container">
            <!-- LOGO 區域 -->
            <div class="logo-container">
                <img src="/images/logo.png" alt="TigerTravel">
            </div>
            
            <h1>會員登入</h1>

            <form th:action="@{/member/login}" method="post">
                <label for="memberAccount">帳號：</label>
                <input type="text" id="memberAccount" name="username" required>

                <label for="memberPassword">密碼：</label>
                <input type="password" id="memberPassword" name="password" required>

                <button type="submit">登入</button>
            </form>

            <div class="links">
                <p>尚未註冊？<a th:href="@{/register}">點我加入🐣</a></p>
                <p><a th:href="@{/member/forgotPassword}">忘記密碼？</a></p>
            </div>
        </div>
    </div>

    <!-- 輪播指示器 -->
    <div class="carousel-indicators">
        <div class="indicator active" data-slide="0"></div>
        <div class="indicator" data-slide="1"></div>
        <div class="indicator" data-slide="2"></div>
        <div class="indicator" data-slide="3"></div>
        <div class="indicator" data-slide="4"></div>
    </div>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // 背景輪播功能
        let currentSlide = 0;
        const slides = document.querySelectorAll('.bg-slide');
        const indicators = document.querySelectorAll('.indicator');
        const totalSlides = slides.length;

        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });
            indicators.forEach((indicator, i) => {
                indicator.classList.toggle('active', i === index);
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            showSlide(currentSlide);
        }

        // 自動輪播
        setInterval(nextSlide, 4000);

        // 點擊指示器切換
        indicators.forEach((indicator, index) => {
            indicator.addEventListener('click', () => {
                currentSlide = index;
                showSlide(currentSlide);
            });
        });

        // SweetAlert2 處理
        window.onload = function () {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get("error");
            const registerSuccess = urlParams.get("registerSuccess");

            if (registerSuccess !== null) {
                Swal.fire({
                    icon: 'success',
                    title: '註冊成功！',
                    text: '歡迎加入，請登入開始使用 💛',
                    confirmButtonText: '登入去！',
                    customClass: {
                        popup: 'swal2-rounded'
                    }
                });
            }

            if (error === "disabled") {
                Swal.fire({
                    icon: 'warning',
                    title: '帳號未啟用',
                    text: '此帳號權限已被關閉，請聯絡客服 🙇‍♀️',
                    confirmButtonText: '我知道了'
                });
            } else if (error === "badCredentials") {
                Swal.fire({
                    icon: 'error',
                    title: '登入失敗',
                    text: '帳號或密碼錯誤，請重新輸入 😣',
                    confirmButtonText: '重試一次'
                });
            } else if (error === "unknown") {
                Swal.fire({
                    icon: 'error',
                    title: '發生錯誤',
                    text: '登入失敗，請稍後再試 🙏',
                    confirmButtonText: '知道了'
                });
            }
        };
    </script>
</body>
</html>
