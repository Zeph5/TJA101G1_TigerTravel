<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>旅遊行程詳情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"> <!-- 加 Bootstrap icon -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
	<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    
    
    <style>
        body { background-color: #f8f9fa; } /* 淺灰背景，讓頁面清爽 */
        .detail-header { background-color: #e3f2fd; border-radius: 10px; padding: 20px; } /* 簡介區藍色背景 */
        .day-card { border-color: #4caf50; } /* 綠色邊框，代表旅行自然 */
        .img-thumbnail { max-height: 200px; object-fit: cover; } /* 圖片固定高度，自動調整 */
        .empty-message { color: #dc3545; font-weight: bold; } /* 空訊息紅色警示 */
    
    
	    @keyframes shrinkFade {
		  0% { transform: scale(1); opacity: 1; }
		  100% { transform: scale(0.1); opacity: 0; }
		}
		
		.shrink-fade-out {
		  animation: shrinkFade 0.4s ease forwards;
		}
    </style>
</head>
<body class="container mt-5">

	<div th:if="${plan.travelPlanBannerUrl != null}" class="mb-4 text-center">
        <img th:src="${plan.travelPlanBannerUrl}" class="img-fluid rounded shadow-sm" alt="旅程主圖">
    </div>

    <h2 class="mb-4 text-primary"><i class="bi bi-map"></i> 旅遊行程詳情</h2> <!-- 加藍色文字和 icon -->

    <div class="detail-header mb-4 shadow-sm">
        <h4 class="fw-bold"><i class="bi bi-journal-text"></i> 旅程標題： <span th:text="${plan.travelTitle}">旅程標題</span></h4>
        <p><i class="bi bi-info-circle"></i> 旅程簡介： <span th:text="${plan.travelPlanDescription}">旅程簡介</span></p>
    </div>
    
    <!-- 收藏按鈕區 -->
	<div class="text-end mb-2">
		<button id="favoriteBtn"
		        th:classappend="${isFavorite} ? 'btn btn-outline-danger' : 'btn btn-outline-secondary'"
		        th:data-plan-id="${plan.travelPlanId}">
		    <i th:classappend="${isFavorite} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
		    <span th:text="${isFavorite} ? '已收藏' : '收藏'">收藏</span>
		</button>
	</div>

    <hr class="my-4">

    <h4 class="text-success"><i class="bi bi-calendar-check"></i> 可報名出發團：</h4>
	<div th:if="${#lists.isEmpty(itineraries)}">
	    <p class="text-danger">目前尚無可報名的行程。</p>
	</div>
	
	<div th:if="${!#lists.isEmpty(itineraries)}">
	    <ul class="list-group mb-4">
	        <li class="list-group-item" th:each="iti : ${itineraries}">
	            <span><i class="bi bi-calendar-date"></i> 出發日期：</span>
	            <span th:text="${iti.startDate}">2025-08-01</span> ～ 
	            <span th:text="${iti.endDate}">2025-08-05</span>
	            ｜ 團費：<span th:text="${iti.totalPrice}">9999</span> 元
	            ｜ <span th:text="'可報名人數：' + ${iti.maxTourist} + '人'">10人</span>
	
	            <!-- 按鈕導向下訂頁 -->
	            <a class="btn btn-sm btn-outline-primary ms-3"
	               th:href="@{/member/tour-order/create(planId=${plan.travelPlanId}, itineraryId=${iti.travelItineraryId})}">
	               馬上報名
	            </a>
	        </li>
	    </ul>
	</div>



    <h4 class="mb-3 text-success"><i class="bi bi-calendar-event"></i> 多天行程表</h4> <!-- 加綠色文字和 icon -->
    <div th:each="entry : ${groupedDays}">
	    <div class="bg-white p-4 mb-4 border rounded shadow-sm">
	        <h4 class="text-success mb-3">
	            <i class="bi bi-calendar-event-fill"></i> 第 
	            <span th:text="${entry.key}"></span> 天行程
	        </h4>
	
	        <div th:each="day : ${entry.value}" class="row mb-3">
	            <div class="col-md-4">
				    <img th:if="${day.scenery.base64Image != null}"
					     th:src="'data:image/jpeg;base64,' + ${day.scenery.base64Image}"
					     class="img-fluid rounded" alt="景點圖" />
					     
					<img th:if="${day.scenery == null or day.scenery.sceneryBanner == null}"
					     th:src="@{/images/bannerSample.jpg}"
					     class="img-fluid rounded" alt="預設圖" />
					
				</div>

	            <div class="col-md-8">
	                <p><strong>景點名稱：</strong> <span th:text="${day.scenery.sceneryName}">名稱</span></p>
	                <p><strong>景點地址：</strong> <span th:text="${day.scenery.sceneryAddress}">地址</span></p>
	                <p><strong>時間安排：</strong> <span th:text="${day.traveltime}">時間</span></p>
	            </div>
	        </div>
	    </div>
	</div>



	<script>
	document.addEventListener('DOMContentLoaded', function () {
	    const favBtn = document.getElementById('favoriteBtn');
	    if (!favBtn) return;
	
	    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
	    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
	
	    favBtn.addEventListener('click', function () {
	        const planId = this.getAttribute('data-plan-id');
	        const isFav = this.classList.contains('btn-outline-danger');
	
	        const url = isFav
	            ? `/member/favorites/tour/remove/${planId}`
	            : `/member/favorites/tour/add/${planId}`;
	
	        fetch(url, {
	            method: 'POST',
	            headers: {
	                'X-Requested-With': 'XMLHttpRequest',
	                [csrfHeader]: csrfToken
	            },
	            credentials: 'same-origin'
	        })
	        .then(res => res.json())
	        .then(data => {
	            if (data.success) {
	                // ✅ 即時切換樣式與圖示
	                const icon = this.querySelector('i');
	                if (isFav) {
	                    // 變成未收藏
	                    this.classList.remove('btn-outline-danger');
	                    this.classList.add('btn-outline-secondary');
	                    icon.classList.remove('bi-heart-fill');
	                    icon.classList.add('bi-heart');
	                    this.innerHTML = '<i class="bi bi-heart"></i> 收藏';
	                } else {
	                    // 變成已收藏
	                    this.classList.remove('btn-outline-secondary');
	                    this.classList.add('btn-outline-danger');
	                    icon.classList.remove('bi-heart');
	                    icon.classList.add('bi-heart-fill');
	                    this.innerHTML = '<i class="bi bi-heart-fill"></i> 已收藏';
	                }
	            } else {
	                alert(data.message || "操作失敗");
	            }
	        })
	        .catch(err => {
	            console.error(err);
	            alert("連線錯誤，請稍後再試");
	        });
	    });
	});
	</script>

	
</body>
</html>
