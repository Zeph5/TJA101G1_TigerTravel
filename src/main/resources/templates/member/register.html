<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>會員註冊 - 臺鴿旅遊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gradient-to-r from-blue-50 to-blue-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white shadow-xl rounded-3xl p-8 w-full max-w-lg transform transition-all duration-500 hover:scale-105 animate-fade-in">
    <h1 class="text-3xl font-bold text-center text-blue-600 mb-8">註冊會員</h1>

    <div th:if="${error}" class="bg-red-100 text-red-700 text-sm mb-6 p-3 rounded-lg text-center" th:text="${error}"></div>
    <div th:if="${message}" class="bg-green-100 text-green-700 text-sm mb-6 p-3 rounded-lg text-center" th:text="${message}"></div>

    <form th:action="@{/member/register}" method="post" enctype="multipart/form-data" th:object="${member}" class="space-y-6">
        <div class="relative">
            <label class="block text-sm font-medium text-gray-700">帳號</label>
            <input type="text" th:field="*{memberAccount}" required class="w-full mt-1 p-3 border border-blue-200 rounded-xl">
            <p class="text-red-500 text-sm" th:if="${#fields.hasErrors('memberAccount')}" th:errors="*{memberAccount}"></p>
        </div>

        <div class="relative">
            <label class="block text-sm font-medium text-gray-700">密碼</label>
            <input type="password" th:field="*{memberPassword}" id="memberPassword" oninput="checkPasswordMatch()" required class="w-full mt-1 p-3 border border-blue-200 rounded-xl">
            <p class="text-red-500 text-sm" th:if="${#fields.hasErrors('memberPassword')}" th:errors="*{memberPassword}"></p>
        </div>

        <div class="relative">
            <label class="block text-sm font-medium text-gray-700">再次輸入密碼</label>
            <input type="password" id="confirmPassword" oninput="checkPasswordMatch()" required class="w-full mt-1 p-3 border border-blue-200 rounded-xl">
            <span id="pw-warning" class="text-red-500 text-sm absolute right-0 top-10"></span>
        </div>

        <div class="relative">
            <label class="block text-sm font-medium text-gray-700">姓名</label>
            <input type="text" th:field="*{memberName}" required class="w-full mt-1 p-3 border border-blue-200 rounded-xl">
            <p class="text-red-500 text-sm" th:if="${#fields.hasErrors('memberName')}" th:errors="*{memberName}"></p>
        </div>

        <div class="relative">
            <label class="block text-sm font-medium text-gray-700">電話</label>
            <input type="text" th:field="*{memberPhone}" class="w-full mt-1 p-3 border border-blue-200 rounded-xl">
            <p class="text-red-500 text-sm" th:if="${#fields.hasErrors('memberPhone')}" th:errors="*{memberPhone}"></p>
        </div>

        <div class="relative">
            <label class="block text-sm font-medium text-gray-700">地址</label>
            <input type="text" th:field="*{memberAddress}" class="w-full mt-1 p-3 border border-blue-200 rounded-xl">
            <p class="text-red-500 text-sm" th:if="${#fields.hasErrors('memberAddress')}" th:errors="*{memberAddress}"></p>
        </div>

        <div class="relative">
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" th:field="*{memberEmail}" required class="w-full mt-1 p-3 border border-blue-200 rounded-xl">
            <p class="text-red-500 text-sm" th:if="${#fields.hasErrors('memberEmail')}" th:errors="*{memberEmail}"></p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">頭像</label>
            <input type="file" name="avatarFile" onchange="previewImage(this)" class="block mt-1 text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100">
            <img id="preview" class="mt-4 rounded-2xl border border-blue-200 max-w-full max-h-48 hidden shadow-md" />
        </div>

        <div th:if="${session.avatarBytes != null}">
            <label class="block text-sm font-medium text-gray-700">目前圖像預覽</label>
            <img th:src="'data:image/jpeg;base64,' + ${session.avatarPreview}" class="rounded-2xl border border-blue-200 max-w-full max-h-48 mt-4 shadow-md" />
        </div>

        <button type="submit" name="action" value="register" id="submitBtn" class="w-full py-3 px-4 bg-blue-400 hover:bg-blue-500 text-white rounded-xl shadow-lg transition-all duration-300 transform hover:scale-105">
            完成註冊
        </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
        已有帳號？ <a th:href="@{/login}" class="text-blue-500 hover:text-blue-600 hover:underline transition-all duration-300">前往登入</a>
    </p>
</div>

<script>
    function checkPasswordMatch() {
        const pw1 = document.getElementById("memberPassword").value;
        const pw2 = document.getElementById("confirmPassword").value;
        const warning = document.getElementById("pw-warning");
        const submitBtn = document.getElementById("submitBtn");

        if (pw1 && pw2 && pw1 !== pw2) {
            warning.textContent = "⚠️ 密碼不一致";
            submitBtn.disabled = true;
        } else {
            warning.textContent = "";
            submitBtn.disabled = false;
        }
    }

    function previewImage(input) {
        const preview = document.getElementById('preview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function (e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        } else {
            preview.src = '';
            preview.style.display = 'none';
        }
    }
</script>

</body>
</html>
