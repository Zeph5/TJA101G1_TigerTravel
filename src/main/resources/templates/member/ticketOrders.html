<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>我的訂單</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h2 class="mb-4">🧾 我的訂單</h2>

    <!-- 切換按鈕 -->
    <div class="mb-4">
        <button class="btn btn-outline-primary me-2" onclick="showTab('ticket')">票券訂單</button>
        <button class="btn btn-outline-success" onclick="showTab('tour')">旅程訂單</button>
    </div>

    <!-- ✅ 票券訂單區塊 -->
    <div id="ticketTab" style="display: block;">
        <h4>🎫 票券訂單</h4>
        <div th:if="${ticketOrders.size() == 0}">
            <p class="text-muted">目前尚未有票券訂單紀錄。</p>
        </div>

        <div class="table-responsive" th:if="${ticketOrders.size() > 0}">
            <table class="table table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>訂單編號</th>
                        <th>票券資訊</th>
                        <th>訂單金額</th>
                        <th>訂單狀態</th>
                        <th>下單時間</th>
                        <th>功能</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${ticketOrders}">
                        <td th:text="${order.ticketOrderId}">1001</td>
                        <td>
                            <div th:each="receipt : ${receiptMap[order.ticketOrderId]}">
                                <div th:if="${receipt != null}">
                                    <div th:if="${receiptImageMap[receipt.ticketOrderReceiptId] != null}">
                                        <img th:src="'data:image/jpeg;base64,' + ${receiptImageMap[receipt.ticketOrderReceiptId]}"
                                             alt="票券圖片" style="width:150px;" />
                                    </div>
                                    <div th:if="${receiptImageMap[receipt.ticketOrderReceiptId] == null}">
                                        <span class="text-muted">尚無圖片</span>
                                    </div>
                                    <span th:text="${ticketMap[receipt.ticketOrderReceiptId]?.ticketName}">票券名稱</span><br>
                                </div>
                            </div>
                        </td>
                        <td th:text="${order.orderPrice} + ' 元'">3000 元</td>
                        <td>
                            <span th:switch="${order.orderStatus}">
                                <span th:case="0" class="text-warning">待付款</span>
                                <span th:case="1" class="text-success">已付款</span>
                                <span th:case="2" class="text-danger">已取消</span>
                                <span th:case="*">未知</span>
                            </span>
                        </td>
                        <td th:text="${order.orderDatetime != null} ? ${#temporals.format(order.orderDatetime, 'yyyy/MM/dd HH:mm')} : '-'"></td>
                        <td>
                            <a th:href="@{'/member/detail/order/' + ${order.ticketOrderId}}"
                               class="btn btn-sm btn-outline-primary">查看明細</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ✅ 旅程訂單區塊 -->
    <div id="tourTab" style="display: none;">
        <h4>🧳 旅程訂單</h4>
        <div th:if="${tourOrders.size() == 0}">
            <p class="text-muted">目前尚未有旅程訂單紀錄。</p>
        </div>

        <div class="table-responsive" th:if="${tourOrders.size() > 0}">
            <table class="table table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>訂單編號</th>
                        <th>旅程標題</th>
                        <th>出發日期</th>
                        <th>人數</th>
                        <th>總金額</th>
                        <th>訂單狀態</th>
                        <th>功能</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${tourOrders}">
                        <td th:text="${order.tourOrderId}">2001</td>
                        <td th:text="${order.travelPlan?.travelTitle}">旅程名稱</td>
                        <td th:text="${#temporals.format(order.startDate, 'yyyy/MM/dd')}">出發日</td>
                        <td th:text="${order.peopleCount}">2</td>
                        <td th:text="${order.totalPrice + ' 元'}">5000 元</td>
                        <td>
                            <span th:switch="${order.orderStatus}">
                                <span th:case="0" class="text-warning">待確認</span>
                                <span th:case="1" class="text-success">已確認</span>
                                <span th:case="2" class="text-danger">已取消</span>
                                <span th:case="*">未知</span>
                            </span>
                        </td>
                        <td>
                            <a th:href="@{'/member/detail/tour-order/' + ${order.tourOrderId}}"
                               class="btn btn-sm btn-outline-success">查看明細</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p><a th:href="@{/index}">回首頁</a></p>    

    <script>
        function showTab(tab) {
            document.getElementById('ticketTab').style.display = tab === 'ticket' ? 'block' : 'none';
            document.getElementById('tourTab').style.display = tab === 'tour' ? 'block' : 'none';
        }
    </script>
</body>
</html>
