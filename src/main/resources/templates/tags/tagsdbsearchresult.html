<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>All Tags DB</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
<style>
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 20%;
    background: linear-gradient(135deg, #f8f9fa, #ffffff);
    border-right: 1px solid #dee2e6;
    padding: 20px 15px;
    overflow-y: auto;
    z-index: 1000;
    box-shadow: 2px 0 6px rgba(0, 0, 0, 0.05);
}

.logo-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid #e3f2fd;
}

.logo-img {
    height: 42px;
}

.site-title {
    font-size: 20px;
    font-weight: bold;
    color: #1e88e5;
}

.sidebar h3 {
    color: #1e88e5;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 20px;
    text-align: center;
    border-bottom: 2px solid #1e88e5;
    padding-bottom: 10px;
}

.sidebar .nav-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.sidebar .nav-list li {
    margin-bottom: 10px;
}

.sidebar .nav-list a {
    display: block;
    width: 100%;
    text-align: center;
    padding: 12px 15px;
    text-decoration: none;
    border-radius: 6px;
    transition: all 0.25s ease;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 2px;
}

.sidebar .nav-list a.btn-primary {
    background-color: #1e88e5;
    color: white;
    border: none;
}

.sidebar .nav-list a.btn-secondary {
    background-color: #e3f2fd;
    color: #1e88e5;
    border: 1px solid #1e88e5;
}

.sidebar .nav-list a:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(30, 136, 229, 0.2);
}

.sidebar .nav-list a.btn-primary:hover {
    background-color: #1976d2;
}

.sidebar .nav-list a.btn-secondary:hover {
    background-color: #bbdefb;
}

.sidebar .nav-list a.active {
    background-color: #1976d2;
    color: white;
}

.main-content {
    margin-left: 20%;
    padding: 15px;
    width: 80%;
}

body {
    margin: 0;
    font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    background: linear-gradient(135deg, #f8f9fa, #ffffff);
}

.search-card {
    background: linear-gradient(135deg, #f8f9fa, #ffffff);
    border: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.tag-id-badge {
    background: linear-gradient(135deg, #6c757d, #adb5bd);
    color: white;
    padding: 4px 8px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
}

.tag-name-badge {
    background: linear-gradient(135deg, #17a2b8, #20c997);
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
}

.search-result-badge {
    background: linear-gradient(135deg, #28a745, #20c997);
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    display: inline-block;
    margin-bottom: 20px;
}

@media (max-width: 768px) {
    .sidebar {
        position: static;
        width: 100%;
        height: auto;
        margin-bottom: 20px;
    }
    
    .main-content {
        margin-left: 0;
    }
}
</style>
</head>
<body>

<!-- Left Sidebar -->
<div class="sidebar">
    <div class="logo-wrapper">
        <img th:src="@{/images/logo.png}" alt="Tiger Travel Logo" class="logo-img" />
        <span class="site-title">後台管理系統</span>
    </div>
    <h3>景點管理</h3>
    <ul class="nav-list">
        <li>
            <a href="/scenery/listallscenery" class="btn btn-primary">景點</a>
        </li>
        <li>
            <a href="/sceneryscore/findAll" class="btn btn-primary">景點評價</a>
        </li>
        <li>
            <a th:href="@{/tags/list}" class="btn btn-primary">景點標籤</a>
        </li>
        <li>
            <a th:href="@{/tagsdb/listall}" class="btn btn-primary active">標籤列</a>
        </li>
        <li>
            <a href="/manager/home" class="btn btn-secondary">🏠 返回管理首頁</a>
        </li>
    </ul>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="container-fluid px-0">
        <div class="px-3">
            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">標籤資料庫搜尋</h2>
                    <p class="text-muted mb-0">搜尋標籤資料庫中的標籤類型</p>
                </div>
                <a th:href="@{/tagsdb/listall}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>返回完整列表
                </a>
            </div>

            <!-- Search Form Card -->
            <div class="card search-card mb-4">
                <div class="card-header bg-light border-0">
                    <h5 class="card-title mb-0 text-primary">
                        <i class="bi bi-search me-2"></i>搜尋標籤
                    </h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/tagsdb/search}" method="get" class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">標籤名稱</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-tag"></i>
                                </span>
                                <input type="text" name="tagName" class="form-control" 
                                       placeholder="輸入標籤名稱進行搜尋">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-search me-1"></i>搜尋
                                </button>
                            </div>
                        </div>

                        <div class="col-md-6 d-flex align-items-end">
                            <div class="d-flex gap-2 w-100">
                                <a class="btn btn-success flex-fill" th:href="@{/tagsdb/add}">
                                    <i class="bi bi-plus-circle me-1"></i>新增標籤
                                </a>
                                <a th:href="@{/tagsdb/listall}" class="btn btn-outline-secondary">
                                    <i class="bi bi-list-ul"></i>
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Search Results Banner -->
            <div th:if="${searchType}" class="text-center mb-4">
                <span class="search-result-badge">
                    <i class="bi bi-funnel me-1"></i>
                    搜尋條件：<span th:text="${searchType}"></span>
                </span>
            </div>

            <!-- Results Table -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-light border-0">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0 text-primary">
                            <i class="bi bi-list-ul me-2"></i>搜尋結果
                        </h5>
                        <span class="badge bg-primary" th:text="${#lists.size(tagsdbList)} + ' 筆結果'">0 筆結果</span>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="text-center">標籤ID</th>
                                    <th>標籤名稱</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="tag : ${tagsdbList}">
                                    <td class="text-center">
                                        <span class="tag-id-badge" th:text="${tag.tagsdbId}"></span>
                                    </td>
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <i class="bi bi-tag-fill text-info me-2"></i>
                                            <span class="tag-name-badge" th:text="${tag.tagsName}"></span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${tagsdbList.empty}" class="text-center py-5">
                <i class="bi bi-search text-muted" style="font-size: 4rem;"></i>
                <h4 class="text-muted mt-3">未找到符合條件的標籤</h4>
                <p class="text-muted">請嘗試其他搜尋關鍵字或新增標籤</p>
                <div class="mt-3">
                    <a th:href="@{/tagsdb/add}" class="btn btn-success me-2">
                        <i class="bi bi-plus-circle me-1"></i>新增標籤
                    </a>
                    <a th:href="@{/tagsdb/listall}" class="btn btn-outline-primary">
                        <i class="bi bi-list-ul me-1"></i>查看所有標籤
                    </a>
                </div>
            </div>

            <!-- Search Tips -->
            <div class="card mt-4 border-0 bg-light">
                <div class="card-body">
                    <h6 class="card-title text-muted">
                        <i class="bi bi-lightbulb me-1"></i>搜尋提示
                    </h6>
                    <div class="row">
                        <div class="col-md-6">
                            <ul class="list-unstyled small text-muted mb-0">
                                <li><i class="bi bi-check2 text-success me-1"></i>支援部分關鍵字搜尋</li>
                                <li><i class="bi bi-check2 text-success me-1"></i>搜尋不區分大小寫</li>
                            </ul>
                        </div>
                        <div class="col-md-6">
                            <ul class="list-unstyled small text-muted mb-0">
                                <li><i class="bi bi-check2 text-success me-1"></i>可搜尋標籤名稱的任何部分</li>
                                <li><i class="bi bi-check2 text-success me-1"></i>留空顯示所有標籤</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
