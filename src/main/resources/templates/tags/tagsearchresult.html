<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Tag Search Result</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
<style>
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 20%;
    background: linear-gradient(135deg, #f8f9fa, #ffffff);
    border-right: 1px solid #dee2e6;
    padding: 20px 15px;
    overflow-y: auto;
    z-index: 1000;
    box-shadow: 2px 0 6px rgba(0, 0, 0, 0.05);
}

.logo-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid #e3f2fd;
}

.logo-img {
    height: 42px;
}

.site-title {
    font-size: 20px;
    font-weight: bold;
    color: #1e88e5;
}

.sidebar h3 {
    color: #1e88e5;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 20px;
    text-align: center;
    border-bottom: 2px solid #1e88e5;
    padding-bottom: 10px;
}

.sidebar .nav-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.sidebar .nav-list li {
    margin-bottom: 10px;
}

.sidebar .nav-list a {
    display: block;
    width: 100%;
    text-align: center;
    padding: 12px 15px;
    text-decoration: none;
    border-radius: 6px;
    transition: all 0.25s ease;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 2px;
}

.sidebar .nav-list a.btn-primary {
    background-color: #1e88e5;
    color: white;
    border: none;
}

.sidebar .nav-list a.btn-secondary {
    background-color: #e3f2fd;
    color: #1e88e5;
    border: 1px solid #1e88e5;
}

.sidebar .nav-list a:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(30, 136, 229, 0.2);
}

.sidebar .nav-list a.btn-primary:hover {
    background-color: #1976d2;
}

.sidebar .nav-list a.btn-secondary:hover {
    background-color: #bbdefb;
}

.sidebar .nav-list a.active {
    background-color: #1976d2;
    color: white;
}

.main-content {
    margin-left: 20%;
    padding: 15px;
    width: 80%;
}

body {
    margin: 0;
    font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    background: linear-gradient(135deg, #f8f9fa, #ffffff);
}

.search-result-badge {
    background: linear-gradient(135deg, #28a745, #20c997);
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    display: inline-block;
    margin-bottom: 20px;
}

.tag-badge {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    background: linear-gradient(135deg, #17a2b8, #20c997);
    color: white;
}

.scenery-link {
    color: #1e88e5;
    text-decoration: none;
    font-weight: 500;
}

.scenery-link:hover {
    color: #1976d2;
    text-decoration: underline;
}

@media (max-width: 768px) {
    .sidebar {
        position: static;
        width: 100%;
        height: auto;
        margin-bottom: 20px;
    }
    
    .main-content {
        margin-left: 0;
    }
}
</style>
</head>
<body>

<!-- Left Sidebar -->
<div class="sidebar">
    <div class="logo-wrapper">
        <img th:src="@{/images/logo.png}" alt="Tiger Travel Logo" class="logo-img" />
        <span class="site-title">後台管理系統</span>
    </div>
    <h3>景點管理</h3>
    <ul class="nav-list">
        <li>
            <a href="/scenery/listallscenery" class="btn btn-primary">景點</a>
        </li>
        <li>
            <a href="/sceneryscore/findAll" class="btn btn-primary">景點評價</a>
        </li>
        <li>
            <a th:href="@{/tags/list}" class="btn btn-primary active">景點標籤</a>
        </li>
        <li>
            <a th:href="@{/tagsdb/listall}" class="btn btn-primary">標籤列</a>
        </li>
        <li>
            <a href="/manager/home" class="btn btn-secondary">🏠 返回管理首頁</a>
        </li>
    </ul>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="container-fluid px-0">
        <div class="px-3">
            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">標籤搜尋結果</h2>
                    <p class="text-muted mb-0">顯示符合搜尋條件的景點標籤</p>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/tags/list}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>返回標籤列表
                    </a>
                    <a th:href="@{/scenery/sceneryindex}" class="btn btn-outline-primary">
                        <i class="bi bi-house me-1"></i>回主頁
                    </a>
                </div>
            </div>

            <!-- Search Filter Banner -->
            <div th:if="${searchType}" class="text-center mb-4">
                <span class="search-result-badge">
                    <i class="bi bi-funnel me-1"></i>
                    篩選條件：<span th:text="${searchType}"></span>
                </span>
            </div>

            <!-- Results Table -->
            <div class="card border-0 shadow-sm" th:if="${tagsList != null and !tagsList.empty}">
                <div class="card-header bg-light border-0">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0 text-primary">
                            <i class="bi bi-list-ul me-2"></i>搜尋結果
                        </h5>
                        <span class="badge bg-primary" th:text="${#lists.size(tagsList)} + ' 筆結果'">0 筆結果</span>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="text-center">標籤ID</th>
                                    <th>標籤名稱</th>
                                    <th>關聯景點</th>
                                    <th class="text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="tag : ${tagsList}">
                                    <td class="text-center fw-bold" th:text="${tag.tagsId}"></td>
                                    <td>
                                        <span class="tag-badge" th:text="${tag.tagsdb.tagsName}"></span>
                                    </td>
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <i class="bi bi-geo-alt text-primary me-2"></i>
                                            <a href="#" class="scenery-link" th:text="${tag.scenery.sceneryName}"></a>
                                        </div>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{/tags/edit/{id}(id=${tag.tagsId})}" 
                                           class="btn btn-warning btn-sm">
                                            <i class="bi bi-pencil-square me-1"></i>編輯
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${tagsList.empty}" class="text-center py-5">
                <i class="bi bi-search text-muted" style="font-size: 4rem;"></i>
                <h4 class="text-muted mt-3">未找到符合條件的標籤</h4>
                <p class="text-muted">請嘗試其他搜尋關鍵字或查看所有標籤</p>
                <div class="mt-3">
                    <a th:href="@{/tags/add}" class="btn btn-success me-2">
                        <i class="bi bi-plus-circle me-1"></i>新增標籤
                    </a>
                    <a th:href="@{/tags/list}" class="btn btn-outline-primary">
                        <i class="bi bi-list-ul me-1"></i>查看所有標籤
                    </a>
                </div>
            </div>

            <!-- Results Summary and Actions -->
            <div th:if="${tagsList != null and !tagsList.empty}" class="mt-4">
                <div class="card border-0 bg-light">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <h6 class="card-title text-muted mb-2">
                                    <i class="bi bi-info-circle me-1"></i>搜尋統計
                                </h6>
                                <p class="small text-muted mb-0">
                                    找到 <strong th:text="${#lists.size(tagsList)}">0</strong> 個標籤關聯，
                                    涵蓋了多個景點的分類標籤
                                </p>
                            </div>
                            <div class="col-md-4 text-end">
                                <a th:href="@{/tags/add}" class="btn btn-success btn-sm me-2">
                                    <i class="bi bi-plus-circle me-1"></i>新增標籤
                                </a>
                                <a th:href="@{/tags/list}" class="btn btn-outline-primary btn-sm">
                                    <i class="bi bi-arrow-clockwise me-1"></i>重新搜尋
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Help Section -->
            <div class="card mt-4 border-0 bg-light">
                <div class="card-body">
                    <h6 class="card-title text-muted">
                        <i class="bi bi-lightbulb me-1"></i>搜尋說明
                    </h6>
                    <div class="row">
                        <div class="col-md-6">
                            <ul class="list-unstyled small text-muted mb-0">
                                <li><i class="bi bi-check2 text-success me-1"></i>可以按標籤名稱搜尋</li>
                                <li><i class="bi bi-check2 text-success me-1"></i>可以按景點名稱搜尋</li>
                            </ul>
                        </div>
                        <div class="col-md-6">
                            <ul class="list-unstyled small text-muted mb-0">
                                <li><i class="bi bi-check2 text-success me-1"></i>搜尋結果顯示標籤與景點的關聯</li>
                                <li><i class="bi bi-check2 text-success me-1"></i>可直接編輯搜尋到的標籤</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
