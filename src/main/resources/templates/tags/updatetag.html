<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Edit Tag</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
<style>
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 20%;
    background: linear-gradient(135deg, #f8f9fa, #ffffff);
    border-right: 1px solid #dee2e6;
    padding: 20px 15px;
    overflow-y: auto;
    z-index: 1000;
    box-shadow: 2px 0 6px rgba(0, 0, 0, 0.05);
}

.logo-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid #e3f2fd;
}

.logo-img {
    height: 42px;
}

.site-title {
    font-size: 20px;
    font-weight: bold;
    color: #1e88e5;
}

.sidebar h3 {
    color: #1e88e5;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 20px;
    text-align: center;
    border-bottom: 2px solid #1e88e5;
    padding-bottom: 10px;
}

.sidebar .nav-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.sidebar .nav-list li {
    margin-bottom: 10px;
}

.sidebar .nav-list a {
    display: block;
    width: 100%;
    text-align: center;
    padding: 12px 15px;
    text-decoration: none;
    border-radius: 6px;
    transition: all 0.25s ease;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 2px;
}

.sidebar .nav-list a.btn-primary {
    background-color: #1e88e5;
    color: white;
    border: none;
}

.sidebar .nav-list a.btn-secondary {
    background-color: #e3f2fd;
    color: #1e88e5;
    border: 1px solid #1e88e5;
}

.sidebar .nav-list a:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(30, 136, 229, 0.2);
}

.sidebar .nav-list a.btn-primary:hover {
    background-color: #1976d2;
}

.sidebar .nav-list a.btn-secondary:hover {
    background-color: #bbdefb;
}

.sidebar .nav-list a.active {
    background-color: #1976d2;
    color: white;
}

.main-content {
    margin-left: 20%;
    padding: 15px;
    width: 80%;
}

body {
    margin: 0;
    font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    background: linear-gradient(135deg, #f8f9fa, #ffffff);
}

.current-selection {
    background: #e3f2fd;
    border: 1px solid #1e88e5;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 20px;
}

.current-tag {
    display: inline-block;
    background: linear-gradient(135deg, #17a2b8, #20c997);
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    margin-right: 10px;
}

.current-scenery {
    display: inline-block;
    background: linear-gradient(135deg, #28a745, #20c997);
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
}

@media (max-width: 768px) {
    .sidebar {
        position: static;
        width: 100%;
        height: auto;
        margin-bottom: 20px;
    }
    
    .main-content {
        margin-left: 0;
    }
}
</style>
</head>
<body>

<!-- Left Sidebar -->
<div class="sidebar">
    <div class="logo-wrapper">
        <img th:src="@{/images/logo.png}" alt="Tiger Travel Logo" class="logo-img" />
        <span class="site-title">後台管理系統</span>
    </div>
    <h3>景點管理</h3>
    <ul class="nav-list">
        <li>
            <a href="/scenery/listallscenery" class="btn btn-primary">景點</a>
        </li>
        <li>
            <a href="/sceneryscore/findAll" class="btn btn-primary">景點評價</a>
        </li>
        <li>
            <a th:href="@{/tags/list}" class="btn btn-primary active">景點標籤</a>
        </li>
        <li>
            <a th:href="@{/tagsdb/listall}" class="btn btn-primary">標籤列</a>
        </li>
        <li>
            <a href="/manager/home" class="btn btn-secondary">🏠 返回管理首頁</a>
        </li>
    </ul>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="container-fluid px-0">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8 col-xl-6">
                <div class="px-3">
                    <!-- Page Header -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="mb-1">編輯景點標籤</h2>
                            <p class="text-muted mb-0">修改標籤與景點的關聯設定</p>
                        </div>
                        <a th:href="@{/tags/list}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>返回列表
                        </a>
                    </div>

                    <!-- Current Selection Info -->
                    <div class="current-selection">
                        <h6 class="mb-2 text-primary">
                            <i class="bi bi-info-circle me-1"></i>目前設定
                        </h6>
                        <div class="d-flex align-items-center flex-wrap gap-2">
                            <span class="current-tag">
                                <i class="bi bi-tag-fill me-1"></i>
                                標籤: <span th:text="${currentTag}">當前標籤</span>
                            </span>
                            <i class="bi bi-arrow-right text-muted mx-2"></i>
                            <span class="current-scenery">
                                <i class="bi bi-geo-alt-fill me-1"></i>
                                景點: <span th:text="${currentScenery}">當前景點</span>
                            </span>
                        </div>
                    </div>

                    <!-- Main Form Card -->
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-warning text-dark border-0">
                            <h5 class="card-title mb-0">
                                <i class="bi bi-pencil-square me-2"></i>編輯標籤設定
                            </h5>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/tags/update}" th:object="${tagsForm}" method="post">
                                <input type="hidden" th:field="*{tagsId}" />
                                
                                <!-- Tag Selection Section -->
                                <div class="row">
                                    <div class="col-12">
                                        <h6 class="text-secondary mb-3 border-bottom pb-2">
                                            <i class="bi bi-tag me-1"></i>標籤設定
                                        </h6>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="tagsdbId" class="form-label fw-semibold">
                                        標籤名稱 <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-tag-fill"></i>
                                        </span>
                                        <select class="form-select form-select-lg" th:field="*{tagsdbId}" required>
                                            <option value="" disabled>請選擇標籤</option>
                                            <option th:each="tagdb : ${tagsdbList}"
                                                    th:value="${tagdb.tagsdbId}"
                                                    th:text="${tagdb.tagsName}"
                                                    th:selected="${tagdb.tagsdbId} == ${tagsForm.tagsdbId}"></option>
                                        </select>
                                    </div>
                                    <div class="form-text">
                                        <i class="bi bi-info-circle me-1"></i>
                                        選擇要關聯到景點的標籤類型
                                    </div>
                                </div>

                                <!-- Scenery Selection Section -->
                                <div class="row">
                                    <div class="col-12">
                                        <h6 class="text-secondary mb-3 border-bottom pb-2">
                                            <i class="bi bi-geo-alt me-1"></i>景點設定
                                        </h6>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="sceneryId" class="form-label fw-semibold">
                                        景點名稱 <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-geo-alt-fill"></i>
                                        </span>
                                        <select class="form-select form-select-lg" th:field="*{sceneryId}" required>
                                            <option value="" disabled>請選擇景點</option>
                                            <option th:each="scene : ${sceneryList}"
                                                    th:value="${scene.sceneryId}"
                                                    th:text="${scene.sceneryName}"
                                                    th:selected="${scene.sceneryId} == ${tagsForm.sceneryId}"></option>
                                        </select>
                                    </div>
                                    <div class="form-text">
                                        <i class="bi bi-info-circle me-1"></i>
                                        選擇要套用此標籤的景點
                                    </div>
                                </div>

                                <!-- Action Buttons -->
                                <div class="row">
                                    <div class="col-12">
                                        <hr class="my-4">
                                        <div class="d-flex justify-content-end gap-3">
                                            <a th:href="@{/tags/list}" class="btn btn-outline-secondary btn-lg px-4">
                                                <i class="bi bi-x-circle me-1"></i>取消
                                            </a>
                                            <button type="submit" class="btn btn-warning btn-lg px-4">
                                                <i class="bi bi-check-circle me-1"></i>更新標籤
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Help Card -->
                    <div class="card mt-4 border-0 bg-light">
                        <div class="card-body">
                            <h6 class="card-title text-muted">
                                <i class="bi bi-lightbulb me-1"></i>編輯說明
                            </h6>
                            <div class="row">
                                <div class="col-md-6">
                                    <ul class="list-unstyled small text-muted mb-0">
                                        <li><i class="bi bi-check2 text-success me-1"></i>修改標籤類型或關聯景點</li>
                                        <li><i class="bi bi-check2 text-success me-1"></i>確認變更前請仔細檢查</li>
                                    </ul>
                                </div>
                                <div class="col-md-6">
                                    <ul class="list-unstyled small text-muted mb-0">
                                        <li><i class="bi bi-check2 text-success me-1"></i>變更會立即生效</li>
                                        <li><i class="bi bi-check2 text-success me-1"></i>可隨時返回重新編輯</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Actions -->
                    <div class="card mt-4 border-0 bg-light">
                        <div class="card-body">
                            <h6 class="card-title text-muted">
                                <i class="bi bi-lightning me-1"></i>快速操作
                            </h6>
                            <div class="row">
                                <div class="col-6 col-md-3 mb-2">
                                    <a th:href="@{/tags/list}" class="btn btn-outline-primary btn-sm w-100">
                                        <i class="bi bi-list-ul"></i><br>
                                        <small>標籤列表</small>
                                    </a>
                                </div>
                                <div class="col-6 col-md-3 mb-2">
                                    <a th:href="@{/tags/add}" class="btn btn-outline-success btn-sm w-100">
                                        <i class="bi bi-plus-circle"></i><br>
                                        <small>新增標籤</small>
                                    </a>
                                </div>
                                <div class="col-6 col-md-3 mb-2">
                                    <a th:href="@{/scenery/listallscenery}" class="btn btn-outline-info btn-sm w-100">
                                        <i class="bi bi-geo-alt"></i><br>
                                        <small>景點管理</small>
                                    </a>
                                </div>
                                <div class="col-6 col-md-3 mb-2">
                                    <a href="/manager/home" class="btn btn-outline-secondary btn-sm w-100">
                                        <i class="bi bi-house"></i><br>
                                        <small>管理首頁</small>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
