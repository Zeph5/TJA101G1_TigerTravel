<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員登入 - TravelTiger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" th:href="@{/css/managerLogin.css}"> 
</head>
<body>
    <div class="header-section">
        <div class="header-logo">TravelTiger</div>        
        </div>
    </div>

    <div class="login-container">
        <h2>Log in</h2>
        
        <div class="test-credentials">
            <h3>測試帳號: alice_mgr</h3>
            <h3>測試密碼: alicePass123</h3>
        </div>

        <div th:if="${param.error}" class="error-message">
            無效的帳號或密碼。
        </div>

        <div th:if="${param.logout}" class="success-message">
            您已成功登出。
        </div>

        <form th:action="@{/manager/login}" method="post">
            <div class="form-group">
                <label for="username">account</label>
                <input type="text" id="username" name="username" placeholder="tibame123" required>
            </div>
            <div class="form-group password-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="8+ characters" required>
                <button type="button" class="password-toggle" id="passwordToggle">Show</button>
            </div>
            <div class="forgot-password">
                <a href="#">Forgot password</a>
            </div>
            <button type="submit">Let's go</button>
        </form>
    </div>

    <div class="footer-logo">
        <p>旅行使我們因世界之美而默然，卻也將我們變成說故事的人</p>
        </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordField = document.getElementById('password');
            const passwordToggle = document.getElementById('passwordToggle');

            if (passwordField && passwordToggle) {
                passwordToggle.addEventListener('click', function() {
                    const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordField.setAttribute('type', type);
                    this.textContent = type === 'password' ? 'Show' : 'Hide';
                });
            }
        });
    </script>
</body>
</html>
