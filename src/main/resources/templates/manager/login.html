<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理員登入 - TravelTiger</title>
<link rel="stylesheet" th:href="@{/css/managerLogin.css}" />
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

</head>
<body>
	<!-- 🔹背景圖 -->
	<div class="background"></div>



	<!-- 🔹Header -->
	<header class="site-header">
		<div class="logo-wrapper">
			<img th:src="@{/logo_image/Tiger_Travel_Logo_1.png}"
				alt="Tiger Travel Logo" class="logo-img" /> <span
				class="site-title">TravelTiger 管理系統</span>
		</div>
	</header>

	<!-- 🔹登入主體 -->
	<div class="login-wrapper">
		<div class="login-container">
			<h2>管理員登入</h2>

			<div class="test-credentials">
				<h3>測試帳號: alice_mgr</h3>
				<h3>測試密碼: alicePass123</h3>
			</div>

			<div th:if="${param.error}" class="error-message">無效的帳號或密碼。</div>
			<div th:if="${param.logout}" class="success-message">您已成功登出。</div>

			<form th:action="@{/manager/login}" method="post">
				<div class="form-group">
					<label for="username">帳號</label> <input type="text" id="username"
						name="username" placeholder="tibame123" required />
				</div>

				<div class="form-group password-group">
					<label for="password">密碼</label>
					<div class="password-wrapper">
						<input type="password" id="password" name="password"
							placeholder="8+ characters" required />
						<button type="button" class="password-toggle" id="passwordToggle">
							<i class="fa-solid fa-eye" id="toggleIcon"></i>
						</button>
					</div>

					<div class="forgot-password">
						<a href="/manager/forgetPassword">忘記密碼？</a>
					</div>

					<button type="submit">登入管理後台</button>
			</form>
		</div>
	</div>
	<!-- ✅ 登入卡片外的名言 -->
	   <div class="footer-logo">
      <p>旅行使我們因世界之美而默然，卻也將我們變成說故事的人</p>
    </div>

	<script>
		document.addEventListener('DOMContentLoaded', function() {
			const passwordField = document.getElementById('password');
			const toggleBtn = document.getElementById('passwordToggle');
			const toggleIcon = document.getElementById('toggleIcon');

			toggleBtn
					.addEventListener('click',
							function() {
								const isPassword = passwordField
										.getAttribute('type') === 'password';
								passwordField.setAttribute('type',
										isPassword ? 'text' : 'password');
								toggleIcon.classList.toggle('fa-eye');
								toggleIcon.classList.toggle('fa-eye-slash');
							});
		});
	</script>
</body>
</html>
