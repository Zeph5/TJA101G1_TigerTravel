<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>忘記密碼 - TravelTiger</title>
  <link rel="stylesheet" th:href="@{/css/managerLogin.css}" />
</head>
<body>
  <div class="background"></div>

  <div class="login-wrapper">
    <div class="login-container">
      <h2>🔐 忘記密碼</h2>
      <p class="form-desc">
        請輸入您註冊時使用的電子郵件，我們會寄送密碼重設連結給您。
      </p>
      <p>測試用信箱:alice.manager@example.com </p>
      
       <div th:if="${error}" class="error-message" style="color: red; margin-bottom: 10px;">
    <p th:text="${error}"></p>
  </div>

      <form th:action="@{/manager/forgetPassword}" method="post">
        <div class="form-group">
          <label for="email">電子郵件</label>
          <input type="email" id="email" name="email" placeholder="alice.manager@example.com" required />
        </div>

        <button type="submit" class="submit-btn">📩 寄送重設連結</button>
      </form>

      <div class="forgot-password" style="text-align: center; margin-top: 24px;">
        <a th:href="@{/manager/login}">← 回登入頁面</a>
      </div>
    </div>

    <div class="footer-logo">
      <p>旅行使我們因世界之美而默然，<br>卻也將我們變成說故事的人</p>
    </div>
  </div>
</body>
</html>
