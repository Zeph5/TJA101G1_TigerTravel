<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant"
th:replace="~{layout :: layout (~{::title}, ~{::body}, ~{})}">
<head>
<meta charset="UTF-8" />
<title>All Scenery List</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet" />
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
<style>
:root {
--main-blue: #1e88e5;
--light-blue: #e3f2fd;
--hover-blue: #bbdefb;
--text-dark: #333;
--text-light: #555;
--danger-red: #dc3545;
--danger-hover: #c82333;
}

.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 20%;
    background: linear-gradient(135deg, #f8f9fa, #ffffff);
    border-right: 1px solid #dee2e6;
    padding: 20px 15px;
    overflow-y: auto;
    z-index: 1000;
    box-shadow: 2px 0 6px rgba(0, 0, 0, 0.05);
}

.logo-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--light-blue);
}

.logo-img {
    height: 42px;
}

.site-title {
    font-size: 20px;
    font-weight: bold;
    color: var(--main-blue);
}

.sidebar h3 {
    color: var(--main-blue);
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 20px;
    text-align: center;
    border-bottom: 2px solid var(--main-blue);
    padding-bottom: 10px;
}

.sidebar .nav-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.sidebar .nav-list li {
    margin-bottom: 10px;
}

.sidebar .nav-list a {
    display: block;
    width: 100%;
    text-align: center;
    padding: 12px 15px;
    text-decoration: none;
    border-radius: 6px;
    transition: all 0.25s ease;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 2px;
}

.sidebar .nav-list a.btn-primary {
    background-color: var(--main-blue);
    color: white;
    border: none;
}

.sidebar .nav-list a.btn-secondary {
    background-color: var(--light-blue);
    color: var(--main-blue);
    border: 1px solid var(--main-blue);
}

.sidebar .nav-list a:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(30, 136, 229, 0.2);
}

.sidebar .nav-list a.btn-primary:hover {
    background-color: #1976d2;
}

.sidebar .nav-list a.btn-secondary:hover {
    background-color: var(--hover-blue);
}

.main-content {
    margin-left: 20%;
    padding: 15px;
    width: 80%;
}



@media (max-width: 768px) {
    .sidebar {
        position: static;
        width: 100%;
        height: auto;
        margin-bottom: 20px;
    }
    
    .main-content {
        margin-left: 0;
    }
}
</style>
</head>
<body>

<!-- Left Sidebar -->
<div class="sidebar">
    <div class="logo-wrapper">
        <img th:src="@{/images/logo.png}" alt="Tiger Travel Logo" class="logo-img" />
        <span class="site-title">後台管理系統</span>
    </div>
    <h3>景點管理</h3>
    <ul class="nav-list">
        <li>
            <a href="/scenery/listallscenery" class="btn btn-primary">景點</a>
        </li>
        <li>
            <a href="/sceneryscore/findAll" class="btn btn-primary">景點評價</a>
        </li>
        <li>
            <a th:href="@{/tags/list}" class="btn btn-primary">景點標籤</a>
        </li>
        <li>
            <a th:href="@{/tagsdb/listall}" class="btn btn-primary">標籤列</a>
        </li>
        <li>
            <a href="/manager/home" class="btn btn-secondary">🏠 返回管理首頁</a>
        </li>
    </ul>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="container-fluid px-0">
        <div class="px-3">
            <h2>All Scenery</h2>
            <form th:action="@{/scenery/listallscenery}" method="get"
                class="row gy-2 gx-3 align-items-center mb-4">

                <div class="col-auto">
                    <input type="text" name="sceneryName" class="form-control"
                        placeholder="Scenery Name" th:value="${sceneryName}" />
                </div>

                <div class="col-auto">
                    <input type="text" name="sceneryAddress" class="form-control"
                        placeholder="Scenery Address" th:value="${sceneryAddress}" />
                </div>

                <div class="col-auto">
                    <select name="sceneryStatusFilter" class="form-select">
                        <option th:value="-1"
                            th:selected="${sceneryStatusFilter == null or sceneryStatusFilter == -1}">All
                            Status</option>
                        <option th:value="0" th:selected="${sceneryStatusFilter == 0}">N/A</option>
                        <option th:value="1" th:selected="${sceneryStatusFilter == 1}">Online</option>
                    </select>
                </div>

                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Search</button>
                    <a th:href="@{/scenery/listallscenery}"
                        class="btn btn-secondary ms-2">Reset</a>
                </div>
            </form>

            <a th:href="@{/scenery/addscenery}" class="btn btn-success mb-3">➕
                Add New Scenery</a>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Banner</th>
                        <th>Name</th>
                        <th>Rating</th>
                        <th>Address</th>
                        <th>Longitude</th>
                        <th>Latitude</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="scenery : ${sceneryPage.content}">
                        <td th:text="${scenery.sceneryId}">1</td>

                        <td><img th:if="${scenery.sceneryBanner != null}"
                            th:src="@{/scenery/banner/{id}(id=${scenery.sceneryId})}"
                            alt="Banner" style="max-width: 100px; max-height: 60px;" /> <span
                            th:if="${scenery.sceneryBanner == null}" class="text-muted">
                                <i class="bi bi-image" style="font-size: 1.5rem;"></i> No Image
                        </span></td>

                        <td><a th:href="@{/scenery/{id}(id=${scenery.sceneryId})}"
                            th:text="${scenery.sceneryName}"
                            class="link-primary text-decoration-none"></a></td>

                        <td th:text="${scenery.rating}">0</td>
                        <td th:text="${scenery.sceneryAddress}">Address</td>
                        <td th:text="${scenery.sceneryLongitude}">0</td>
                        <td th:text="${scenery.sceneryLatitude}">0</td>

                        <td>
                            <form th:action="@{/scenery/updatestatus}" method="post"
                                th:id="'statusForm' + ${scenery.sceneryId}">
                                <input type="hidden" name="sceneryId"
                                    th:value="${scenery.sceneryId}" /> <select name="sceneryStatus"
                                    class="form-select form-select-sm"
                                    th:onchange="|document.getElementById('statusForm' + [[${scenery.sceneryId}]]).submit()|">
                                    <option th:value="0" th:selected="${scenery.sceneryStatus == 0}">N/A</option>
                                    <option th:value="1" th:selected="${scenery.sceneryStatus == 1}">Online</option>
                                </select>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="px-3">
            <nav th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center mt-4">

                    <li class="page-item"
                        th:classappend="${currentPage == 0} ? 'disabled'"><a
                        class="page-link"
                        th:href="@{/scenery/listallscenery(page=0, sceneryName=${sceneryName}, sceneryAddress=${sceneryAddress}, sceneryStatusFilter=${sceneryStatusFilter})}">First</a>
                    </li>

                    <li class="page-item"
                        th:classappend="${currentPage == 0} ? 'disabled'"><a
                        class="page-link"
                        th:href="@{/scenery/listallscenery(page=${currentPage - 1}, sceneryName=${sceneryName}, sceneryAddress=${sceneryAddress}, sceneryStatusFilter=${sceneryStatusFilter})}">Previous</a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence((currentPage - 2 > 0 ? currentPage - 2 : 0), (currentPage + 2 < totalPages - 1 ? currentPage + 2 : totalPages - 1))}"
                        th:classappend="${i == currentPage} ? 'active'"><a
                        class="page-link"
                        th:href="@{/scenery/listallscenery(page=${i}, sceneryName=${sceneryName}, sceneryAddress=${sceneryAddress}, sceneryStatusFilter=${sceneryStatusFilter})}"
                        th:text="${i + 1}">1</a></li>

                    <li class="page-item"
                        th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                        <a class="page-link"
                        th:href="@{/scenery/listallscenery(page=${currentPage + 1}, sceneryName=${sceneryName}, sceneryAddress=${sceneryAddress}, sceneryStatusFilter=${sceneryStatusFilter})}">Next</a>
                    </li>

                    <li class="page-item"
                        th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                        <a class="page-link"
                        th:href="@{/scenery/listallscenery(page=${totalPages - 1}, sceneryName=${sceneryName}, sceneryAddress=${sceneryAddress}, sceneryStatusFilter=${sceneryStatusFilter})}">Last</a>
                    </li>

                </ul>
            </nav>
        </div>
    </div>
</div>

</body>
</html>
