<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant"
th:replace="~{layout :: layout (~{::title}, ~{::body}, ~{})}">
<head>
<meta charset="UTF-8" />
<title>All Scenery List</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet" />
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
</head>
<body>

	<div class="container mt-4">
		<h2>All Scenery</h2>
		<form th:action="@{/scenery/listallscenery}" method="get"
			class="row gy-2 gx-3 align-items-center mb-4">

			<div class="col-auto">
				<input type="text" name="sceneryName" class="form-control"
					placeholder="Scenery Name" th:value="${sceneryName}" />
			</div>

			<div class="col-auto">
				<input type="text" name="sceneryAddress" class="form-control"
					placeholder="Scenery Address" th:value="${sceneryAddress}" />
			</div>

			<div class="col-auto">
				<select name="sceneryStatusFilter" class="form-select">
					<option th:value="-1"
						th:selected="${sceneryStatusFilter == null or sceneryStatusFilter == -1}">All
						Status</option>
					<option th:value="0" th:selected="${sceneryStatusFilter == 0}">N/A</option>
					<option th:value="1" th:selected="${sceneryStatusFilter == 1}">Online</option>
				</select>
			</div>

			<div class="col-auto">
				<button type="submit" class="btn btn-primary">Search</button>
				<a th:href="@{/scenery/listallscenery}"
					class="btn btn-secondary ms-2">Reset</a>
			</div>
		</form>

		<a th:href="@{/scenery/addscenery}" class="btn btn-success mb-3">➕
			Add New Scenery</a>

		<table class="table table-bordered table-hover">
			<thead class="table-light">
				<tr>
					<th>ID</th>
					<th>Banner</th>
					<th>Name</th>
					<th>Rating</th>
					<th>Address</th>
					<th>Longitude</th>
					<th>Latitude</th>
					<th>Status</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="scenery : ${sceneryPage.content}">
					<td th:text="${scenery.sceneryId}">1</td>

					<td><img th:if="${scenery.sceneryBanner != null}"
						th:src="@{/scenery/banner/{id}(id=${scenery.sceneryId})}"
						alt="Banner" style="max-width: 100px; max-height: 60px;" /> <span
						th:if="${scenery.sceneryBanner == null}" class="text-muted">
							<i class="bi bi-image" style="font-size: 1.5rem;"></i> No Image
					</span></td>

					<td><a th:href="@{/scenery/{id}(id=${scenery.sceneryId})}"
						th:text="${scenery.sceneryName}"
						class="link-primary text-decoration-none"></a></td>

					<td th:text="${scenery.rating}">0</td>
					<td th:text="${scenery.sceneryAddress}">Address</td>
					<td th:text="${scenery.sceneryLongitude}">0</td>
					<td th:text="${scenery.sceneryLatitude}">0</td>

					<td>
						<form th:action="@{/scenery/updatestatus}" method="post"
							th:id="'statusForm' + ${scenery.sceneryId}">
							<input type="hidden" name="sceneryId"
								th:value="${scenery.sceneryId}" /> <select name="sceneryStatus"
								class="form-select form-select-sm"
								th:onchange="|document.getElementById('statusForm' + [[${scenery.sceneryId}]]).submit()|">
								<option th:value="0" th:selected="${scenery.sceneryStatus == 0}">N/A</option>
								<option th:value="1" th:selected="${scenery.sceneryStatus == 1}">Online</option>
							</select>
						</form>
					</td>
				</tr>
			</tbody>
		</table>

		<nav th:if="${totalPages > 1}">
			<ul class="pagination justify-content-center mt-4">

				<li class="page-item"
					th:classappend="${currentPage == 0} ? 'disabled'"><a
					class="page-link"
					th:href="@{/scenery/listallscenery(page=0, sceneryName=${sceneryName}, sceneryAddress=${sceneryAddress}, sceneryStatusFilter=${sceneryStatusFilter})}">First</a>
				</li>

				<li class="page-item"
					th:classappend="${currentPage == 0} ? 'disabled'"><a
					class="page-link"
					th:href="@{/scenery/listallscenery(page=${currentPage - 1}, sceneryName=${sceneryName}, sceneryAddress=${sceneryAddress}, sceneryStatusFilter=${sceneryStatusFilter})}">Previous</a>
				</li>

				<li class="page-item"
					th:each="i : ${#numbers.sequence((currentPage - 2 > 0 ? currentPage - 2 : 0), (currentPage + 2 < totalPages - 1 ? currentPage + 2 : totalPages - 1))}"
					th:classappend="${i == currentPage} ? 'active'"><a
					class="page-link"
					th:href="@{/scenery/listallscenery(page=${i}, sceneryName=${sceneryName}, sceneryAddress=${sceneryAddress}, sceneryStatusFilter=${sceneryStatusFilter})}"
					th:text="${i + 1}">1</a></li>

				<li class="page-item"
					th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
					<a class="page-link"
					th:href="@{/scenery/listallscenery(page=${currentPage + 1}, sceneryName=${sceneryName}, sceneryAddress=${sceneryAddress}, sceneryStatusFilter=${sceneryStatusFilter})}">Next</a>
				</li>

				<li class="page-item"
					th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
					<a class="page-link"
					th:href="@{/scenery/listallscenery(page=${totalPages - 1}, sceneryName=${sceneryName}, sceneryAddress=${sceneryAddress}, sceneryStatusFilter=${sceneryStatusFilter})}">Last</a>
				</li>

			</ul>
		</nav>
	</div>

</body>
</html>
