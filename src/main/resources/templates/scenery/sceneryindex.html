<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Scenery Index</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<!-- Top Navbar -->
<nav class="navbar navbar-expand-md navbar-dark bg-success fixed-top justify-content-center">
    <div class="container text-center">
        <h2 class="text-white">sceneryindex.html</h2>
        <h3><a class="navbar-brand" th:href="@{/}">Home</a></h3>

</nav>

        <li>

                <a href="/scenery/listallscenery" class="btn btn-primary">景點</a>

        </li>

    <ul>
        <li>
            <h2>
                <a th:href="@{/tags/list}" class="btn btn-primary">景點標籤</a>
            </h2>
        </li>

    <ul>
        <li>
            <h2>

 </div> <!-- /.container -->
