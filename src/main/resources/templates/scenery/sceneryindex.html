<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant"
th:replace="~{layout :: layout (~{::title}, ~{::body}, ~{::cssLinks})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Scenery Index</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <th:block th:fragment="cssLinks">
	<link rel="stylesheet" th:href="@{/css/home.css}" />
</th:block>
</head>
<body>



<!-- Page Body -->
<div class="container" style="margin-top: 100px;">

    <h1>Scenery Index</h1>
    <div class="errorblock text-danger" th:utext="${errorMessage}"></div>
    <br>

    <div th:if="${SceneryVO != null}">
        <div th:insert="~{/scenery/listonescenery :: listonescenery-div}"></div>
    </div>
    <ul>

        <li>
            <h2>
                <a href="/scenery/listallscenery" class="btn btn-primary">景點</a> 
            </h2>
        </li>
    </ul>
    
    <ul>
        <li>
            <h2>
                <a href="/sceneryscore/findAll" class="btn btn-primary">景點評價</a>

            </h2>
        </li>
    </ul>

    <ul>
        <li>
            <h2>
                <a th:href="@{/tags/list}" class="btn btn-primary">景點標籤</a>
            </h2>
        </li>
    </ul>
    

    <ul>
        <li>
            <h2>
                <a th:href="@{/tagsdb/listall}" class="btn btn-primary">標籤列</a> 
            </h2>
        </li>
    </ul>
 </div> <!-- /.container -->

</body>
</html>
