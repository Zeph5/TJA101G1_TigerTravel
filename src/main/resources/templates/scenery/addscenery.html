<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>Add Scenery</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet" />
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
<style>
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 20%;
    background: linear-gradient(135deg, #f8f9fa, #ffffff);
    border-right: 1px solid #dee2e6;
    padding: 20px 15px;
    overflow-y: auto;
    z-index: 1000;
    box-shadow: 2px 0 6px rgba(0, 0, 0, 0.05);
}

.logo-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid #e3f2fd;
}

.logo-img {
    height: 42px;
}

.site-title {
    font-size: 20px;
    font-weight: bold;
    color: #1e88e5;
}

.sidebar h3 {
    color: #1e88e5;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 20px;
    text-align: center;
    border-bottom: 2px solid #1e88e5;
    padding-bottom: 10px;
}

.sidebar .nav-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.sidebar .nav-list li {
    margin-bottom: 10px;
}

.sidebar .nav-list a {
    display: block;
    width: 100%;
    text-align: center;
    padding: 12px 15px;
    text-decoration: none;
    border-radius: 6px;
    transition: all 0.25s ease;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 2px;
}

.sidebar .nav-list a.btn-primary {
    background-color: #1e88e5;
    color: white;
    border: none;
}

.sidebar .nav-list a.btn-secondary {
    background-color: #e3f2fd;
    color: #1e88e5;
    border: 1px solid #1e88e5;
}

.sidebar .nav-list a:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(30, 136, 229, 0.2);
}

.sidebar .nav-list a.btn-primary:hover {
    background-color: #1976d2;
}

.sidebar .nav-list a.btn-secondary:hover {
    background-color: #bbdefb;
}

.main-content {
    margin-left: 20%;
    padding: 15px;
    width: 80%;
}

body {
    margin: 0;
    font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    background: linear-gradient(135deg, #f8f9fa, #ffffff);
}

@media (max-width: 768px) {
    .sidebar {
        position: static;
        width: 100%;
        height: auto;
        margin-bottom: 20px;
    }
    
    .main-content {
        margin-left: 0;
    }
}
</style>
</head>
<body>

<!-- Left Sidebar -->
<div class="sidebar">
    <div class="logo-wrapper">
        <img th:src="@{/images/logo.png}" alt="Tiger Travel Logo" class="logo-img" />
        <span class="site-title">後台管理系統</span>
    </div>
    <h3>景點管理</h3>
    <ul class="nav-list">
        <li>
            <a href="/scenery/listallscenery" class="btn btn-primary">景點</a>
        </li>
        <li>
            <a href="/sceneryscore/findAll" class="btn btn-primary">景點評價</a>
        </li>
        <li>
            <a th:href="@{/tags/list}" class="btn btn-primary">景點標籤</a>
        </li>
        <li>
            <a th:href="@{/tagsdb/listall}" class="btn btn-primary">標籤列</a>
        </li>
        <li>
            <a href="/manager/home" class="btn btn-secondary">🏠 返回管理首頁</a>
        </li>
    </ul>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="container-fluid px-0">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <div class="px-3">
                    <!-- Page Header -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="mb-1">新增景點</h2>
                            <p class="text-muted mb-0">填寫景點基本資訊以新增至系統</p>
                        </div>
                        <a th:href="@{/scenery/listallscenery}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>返回列表
                        </a>
                    </div>
                    
                    <!-- Main Form Card -->
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-light border-0">
                            <h5 class="card-title mb-0 text-primary">
                                <i class="bi bi-geo-alt me-2"></i>景點資訊
                            </h5>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/scenery/addscenery}" th:object="${sceneryDTO}" method="post" enctype="multipart/form-data">
                                
                                <!-- Basic Information Section -->
                                <div class="row">
                                    <div class="col-12">
                                        <h6 class="text-secondary mb-3 border-bottom pb-2">
                                            <i class="bi bi-info-circle me-1"></i>基本資訊
                                        </h6>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="sceneryName" class="form-label fw-semibold">
                                                景點名稱 <span class="text-danger">*</span>
                                            </label>
                                            <input type="text" th:field="*{sceneryName}" id="sceneryName" 
                                                   class="form-control form-control-lg" 
                                                   placeholder="請輸入景點名稱" required />
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="sceneryAddress" class="form-label fw-semibold">
                                                景點地址 <span class="text-danger">*</span>
                                            </label>
                                            <input type="text" th:field="*{sceneryAddress}" id="sceneryAddress" 
                                                   class="form-control form-control-lg" 
                                                   placeholder="請輸入完整地址" required />
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="sceneryIntro" class="form-label fw-semibold">景點介紹</label>
                                    <textarea th:field="*{sceneryIntro}" id="sceneryIntro" 
                                              class="form-control" rows="4" 
                                              placeholder="請輸入景點詳細介紹..."></textarea>
                                    <div class="form-text">建議詳細描述景點特色、開放時間等資訊</div>
                                </div>

                                <!-- Location Information Section -->
                                <div class="row">
                                    <div class="col-12">
                                        <h6 class="text-secondary mb-3 border-bottom pb-2">
                                            <i class="bi bi-geo me-1"></i>地理位置
                                        </h6>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="sceneryLongitude" class="form-label fw-semibold">
                                                經度 <span class="text-danger">*</span>
                                            </label>
                                            <div class="input-group">
                                                <span class="input-group-text">
                                                    <i class="bi bi-globe"></i>
                                                </span>
                                                <input type="number" step="any" th:field="*{sceneryLongitude}" 
                                                       id="sceneryLongitude" class="form-control" 
                                                       placeholder="例: 121.5654" required />
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="sceneryLatitude" class="form-label fw-semibold">
                                                緯度 <span class="text-danger">*</span>
                                            </label>
                                            <div class="input-group">
                                                <span class="input-group-text">
                                                    <i class="bi bi-globe"></i>
                                                </span>
                                                <input type="number" step="any" th:field="*{sceneryLatitude}" 
                                                       id="sceneryLatitude" class="form-control" 
                                                       placeholder="例: 25.0330" required />
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="alert alert-info border-0" role="alert">
                                    <i class="bi bi-info-circle me-2"></i>
                                    <strong>提示：</strong>可使用 Google Maps 右鍵點擊地點查看經緯度座標
                                </div>

                                <!-- Image Upload Section -->
                                <div class="row">
                                    <div class="col-12">
                                        <h6 class="text-secondary mb-3 border-bottom pb-2">
                                            <i class="bi bi-image me-1"></i>景點圖片
                                        </h6>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="sceneryBannerFile" class="form-label fw-semibold">主要圖片</label>
                                    <input type="file" th:field="*{sceneryBannerFile}" id="sceneryBannerFile" 
                                           class="form-control form-control-lg" 
                                           accept="image/*" />
                                    <div class="form-text">
                                        <i class="bi bi-exclamation-triangle me-1"></i>
                                        建議上傳高解析度圖片，支援 JPG、PNG 格式，檔案大小不超過 5MB
                                    </div>
                                </div>

                                <!-- Action Buttons -->
                                <div class="row">
                                    <div class="col-12">
                                        <hr class="my-4">
                                        <div class="d-flex justify-content-end gap-3">
                                            <a th:href="@{/scenery/listallscenery}" class="btn btn-outline-secondary btn-lg px-4">
                                                <i class="bi bi-x-circle me-1"></i>取消
                                            </a>
                                            <button type="submit" class="btn btn-primary btn-lg px-4">
                                                <i class="bi bi-plus-circle me-1"></i>新增景點
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Quick Tips Card -->
                    <div class="card mt-4 border-0 bg-light">
                        <div class="card-body">
                            <h6 class="card-title text-muted">
                                <i class="bi bi-lightbulb me-1"></i>操作提示
                            </h6>
                            <div class="row">
                                <div class="col-md-6">
                                    <ul class="list-unstyled small text-muted mb-0">
                                        <li><i class="bi bi-check2 text-success me-1"></i>景點名稱應具有辨識性</li>
                                        <li><i class="bi bi-check2 text-success me-1"></i>地址請填寫完整資訊</li>
                                    </ul>
                                </div>
                                <div class="col-md-6">
                                    <ul class="list-unstyled small text-muted mb-0">
                                        <li><i class="bi bi-check2 text-success me-1"></i>經緯度用於地圖定位</li>
                                        <li><i class="bi bi-check2 text-success me-1"></i>圖片有助於吸引遊客</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
