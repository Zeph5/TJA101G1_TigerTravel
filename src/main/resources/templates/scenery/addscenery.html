<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Add Scenery</title>
</head>
<body>
    <h2>Add New Scenery</h2>
    <form th:action="@{/scenery/addscenery}" th:object="${sceneryDTO}" method="post" enctype="multipart/form-data">
        <label for="sceneryName">Name:</label>
        <input type="text" th:field="*{sceneryName}" id="sceneryName" /><br/>

        <label for="sceneryIntro">Intro:</label>
        <textarea th:field="*{sceneryIntro}" id="sceneryIntro"></textarea><br/>

        <label for="sceneryAddress">Address:</label>
        <input type="text" th:field="*{sceneryAddress}" id="sceneryAddress" /><br/>

        <label for="sceneryLongitude">Longitude:</label>
        <input type="number" step="any" th:field="*{sceneryLongitude}" id="sceneryLongitude" /><br/>

        <label for="sceneryLatitude">Latitude:</label>
        <input type="number" step="any" th:field="*{sceneryLatitude}" id="sceneryLatitude" /><br/>

        <label for="sceneryBannerFile">Banner Image:</label>
        <input type="file" th:field="*{sceneryBannerFile}" id="sceneryBannerFile" /><br/>

        <button type="submit">Add Scenery</button>
    </form>
</body>
</html>
