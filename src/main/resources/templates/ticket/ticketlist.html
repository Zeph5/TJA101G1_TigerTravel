<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>票券一覽</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        .ticket-card img { max-height: 160px; object-fit: cover; }
        .ticket-card { margin-bottom: 30px; }
        .section-divider { border-top: 3px dashed #888; margin: 2rem 0 2rem 0; }
        .cart-fixed { position: sticky; top: 32px; }
    </style>
</head>
<body>
<div class="container my-4">
    <h2 class="mb-4 text-center">票券一覽</h2>
    <form class="form-inline mb-4 justify-content-center" method="get" th:action="@{/ticketlist}">
        <input class="form-control mr-2" type="search" placeholder="請輸入票券名稱" aria-label="Search" name="keyword" th:value="${keyword}">
        <button class="btn btn-primary" type="submit">查詢</button>
    </form>
    <div class="row">
        <!-- 左側：票券清單 -->
        <div class="col-lg-9">
            <form id="cartForm" th:action="@{/ticket/ticketorder}" method="post">
                <!-- 查詢結果區塊 -->
                <div th:if="${searchList != null}">
                    <h4 class="text-primary text-center">查詢結果</h4>
                    <div class="row">
                        <div th:each="ticket : ${searchList}" class="col-md-6 col-lg-4 ticket-card">
                            <div class="card h-100 shadow-sm">
                                <div class="card-img-top text-center bg-light" style="height: 140px;">
                                    <img th:if="${ticket.ticketImage != null}" th:src="'/ticket/image/' + ${ticket.ticketId}" class="img-fluid h-100" alt="票券圖片" />
                                    <span th:if="${ticket.ticketImage == null}" class="text-muted align-middle">無圖片</span>
                                </div>
                                <div class="card-body">
                                    <h5 class="card-title" th:text="${ticket.ticketName}">票券名稱</h5>
                                    <p class="card-text" th:text="${ticket.ticketDescription}">票券描述</p>
                                </div>
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item">價格：<span th:text="${ticket.ticketPrice}">0</span> 元</li>
                                    <li class="list-group-item">庫存：<span th:text="${ticket.ticketStock}"></span></li>
                                    <li class="list-group-item">狀態：<span th:text="${ticket.ticketStatus == 1 ? '有庫存' : '無庫存'}" th:classappend="${ticket.ticketStatus == 1 ? 'text-success' : 'text-danger'}"></span></li>
                                </ul>
                                <div class="form-check mt-2 mb-1 text-center">
                                    <input class="form-check-input" type="checkbox" name="ticketIds"
                                           th:value="${ticket.ticketId}"
                                           th:id="'searchSelectTicket__' + ${ticket.ticketId}"
                                           th:data-ticket-id="${ticket.ticketId}"
                                           th:data-ticket-name="${ticket.ticketName}"
                                           th:data-ticket-price="${ticket.ticketPrice}"
                                           onchange="handleTicketCheck(this)" />
                                    <label class="form-check-label" th:for="'searchSelectTicket__' + ${ticket.ticketId}">選擇下單</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div th:if="${searchList.size() == 0}" class="alert alert-danger text-center my-3" role="alert">
                        查無此票
                    </div>
                    <hr class="section-divider">
                </div>
                <!-- 全部票券區塊 -->
                <h4 class="text-secondary text-center">全部票券</h4>
                <div class="row" th:if="${ticketPage != null and ticketPage.content.size() > 0}">
                    <div th:each="ticket : ${ticketPage.content}" class="col-md-6 col-lg-4 ticket-card">
                        <div class="card h-100 shadow-sm">
                            <div class="card-img-top text-center bg-light" style="height: 140px;">
                                <img th:if="${ticket.ticketImage != null}" th:src="'/ticket/image/' + ${ticket.ticketId}" class="img-fluid h-100" alt="票券圖片" />
                                <span th:if="${ticket.ticketImage == null}" class="text-muted align-middle">無圖片</span>
                            </div>
                            <div class="card-body">
                                <h5 class="card-title" th:text="${ticket.ticketName}">票券名稱</h5>
                                <p class="card-text" th:text="${ticket.ticketDescription}">票券描述</p>
                            </div>
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item">價格：<span th:text="${ticket.ticketPrice}">0</span> 元</li>
                                <li class="list-group-item">庫存：<span th:text="${ticket.ticketStock}"></span></li>
                                <li class="list-group-item">狀態：<span th:text="${ticket.ticketStatus == 1 ? '有庫存' : '無庫存'}" th:classappend="${ticket.ticketStatus == 1 ? 'text-success' : 'text-danger'}"></span></li>
                            </ul>
                            <div class="form-check mt-2 mb-1 text-center">
                                <input class="form-check-input" type="checkbox" name="ticketIds"
                                       th:value="${ticket.ticketId}"
                                       th:id="'allSelectTicket__' + ${ticket.ticketId}"
                                       th:data-ticket-id="${ticket.ticketId}"
                                       th:data-ticket-name="${ticket.ticketName}"
                                       th:data-ticket-price="${ticket.ticketPrice}"
                                       onchange="handleTicketCheck(this)" />
                                <label class="form-check-label" th:for="'allSelectTicket__' + ${ticket.ticketId}">選擇下單</label>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 分頁區 -->
                <nav class="mt-4" th:if="${ticketPage != null and ticketPage.totalPages > 1}">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${ticketPage.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/ticketlist(page=${currentPage - 1}, size=${pageSize})}">上一頁</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, ticketPage.totalPages - 1)}"
                            th:classappend="${i} == ${currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/ticketlist(page=${i}, size=${pageSize})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${ticketPage.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/ticketlist(page=${currentPage + 1}, size=${pageSize})}">下一頁</a>
                        </li>
                    </ul>
                </nav>
                <div class="text-center my-3">
                    <button type="submit" class="btn btn-success btn-lg px-5">放入購物車</button>
                </div>
            </form>
        </div>
        <!-- 右側：購物車即時預覽 -->
        <div class="col-lg-3">
            <div class="card cart-fixed">
                <div class="card-header bg-success text-white">目前選購清單</div>
                <div class="card-body" id="cartPreview">
                    <span class="text-muted">尚未選購任何票券</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 跨頁購物車記憶功能 JS，直接複製以下即可 -->
<script>
const STORAGE_KEY = 'cartTickets';
// 初始化 selectedTickets 內容
let selectedTickets = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

// 更新右側預覽欄
function updateCartView() {
    const container = document.getElementById('cartPreview');
    container.innerHTML = '';
    const keys = Object.keys(selectedTickets);
    if (keys.length === 0) {
        container.innerHTML = '<span class="text-muted">尚未選購任何票券</span>';
        return;
    }
    let total = 0;
    keys.forEach(id => {
        const item = selectedTickets[id];
        total += Number(item.price);
        const row = document.createElement('div');
        row.className = "mb-2 border-bottom";
        row.innerHTML = `<b>${item.name}</b> <br> $${item.price}元`;
        container.appendChild(row);
    });
    container.innerHTML += `<div class="mt-2 font-weight-bold">合計：$${total} 元</div>`;
}

// 還原已選票券的 checkbox 狀態
function restoreCheckboxState() {
    for (const id in selectedTickets) {
        const checkbox = document.querySelector(`[data-ticket-id="${id}"]`);
        if (checkbox) checkbox.checked = true;
    }
}

// 當勾選/取消時同步 localStorage
function handleTicketCheck(e) {
    const ticketId = e.getAttribute('data-ticket-id');
    const name = e.getAttribute('data-ticket-name');
    const price = e.getAttribute('data-ticket-price');
    if (e.checked) {
        selectedTickets[ticketId] = { name, price };
    } else {
        delete selectedTickets[ticketId];
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedTickets));
    updateCartView();
}

// 頁面載入時自動還原
window.onload = function() {
    selectedTickets = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    updateCartView();
    restoreCheckboxState();
}
</script>
</body>
</html>
