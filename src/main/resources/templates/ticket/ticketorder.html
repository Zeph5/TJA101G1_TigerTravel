<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>確認下單</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/unified.css">
</head>
<body>
    <div class="container my-5">
        <div class="main-card">
            <h2 class="page-title">確認下單</h2>
            <form id="orderForm" th:action="@{/ticket/submit}" method="post">
                <div th:each="ticket : ${selectedTickets}" class="card mb-3">
                    <div class="card-body">
                        <h5 th:text="${ticket.ticketName}">票券名稱</h5>
                        <div>價格：<span th:text="${ticket.ticketPrice}">0</span> 元</div>
                        <div>庫存：<span th:text="${ticket.ticketStock}">0</span></div>
                        <div>
                            <label>購買數量：</label>
                            <input type="number"
                                   class="form-control w-25 d-inline"
                                   name="quantities"
                                   min="1"
                                   th:attr="max=${ticket.ticketStock}"
                                   value="1" />
                            <input type="hidden" name="ticketIds" th:value="${ticket.ticketId}" />
                        </div>
                    </div>
                </div>
                <hr />
                <h4 class="mt-4">付款資訊（信用卡）</h4>
                <div class="form-group">
                    <label>信用卡卡號：</label>
                    <input type="text" class="form-control" name="cardNumber" maxlength="16" required pattern="\d{16}">
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>到期月：</label>
                        <input type="text" class="form-control" name="expMonth" maxlength="2" required pattern="\d{2}">
                    </div>
                    <div class="form-group col-md-6">
                        <label>到期年：</label>
                        <input type="text" class="form-control" name="expYear" maxlength="2" required pattern="\d{2}">
                    </div>
                </div>
                <div class="form-group">
                    <label>安全碼(CVV)：</label>
                    <input type="text" class="form-control" name="cvv" maxlength="3" required pattern="\d{3}">
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-success btn-lg">完成下單</button>
                </div>
            </form>
        </div>
    </div>
    <script>
    document.getElementById('orderForm').addEventListener('submit', function(e) {
        let valid = true;
        let warnMsg = '';
        document.querySelectorAll('input[name="quantities"]').forEach(function(input) {
            const max = parseInt(input.max, 10);
            const val = parseInt(input.value, 10);
            if (val > max) {
                valid = false;
                warnMsg += `購買數量不可超過庫存上限 (${max})！\n`;
            }
            if (val < 1) {
                valid = false;
                warnMsg += "購買數量至少為 1！\n";
            }
        });
        if (!valid) {
            alert(warnMsg);
            e.preventDefault();
        }
    });
    </script>
</body>
</html>
