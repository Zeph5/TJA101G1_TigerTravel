<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>付款完成 - 訂單明細</title>
    <link rel="stylesheet" href="/css/unified.css">
</head>
<body>
    <div class="container my-5">
        <div class="main-card">
            <h1 class="page-title" style="font-size:2.1rem;">付款完成</h1>
            <h2 class="mb-3" style="font-size:1.4rem;">訂單明細</h2>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>品項名稱</th>
                        <th>數量</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${orderItems}">
                        <td th:text="${item.name}">品項名稱</td>
                        <td th:text="${item.quantity}">1</td>
                    </tr>
                </tbody>
            </table>
            <div class="mt-3">
                <strong>總金額：</strong> <span th:text="${totalAmount}">0</span> 元
            </div>
            <div>
                <strong>會員帳號：</strong> <span th:text="${memberName}">會員名稱</span>
            </div>
            <div>
                <strong>下單時間：</strong> <span th:text="${orderTime}">2025-07-10 12:00</span>
            </div>
            <div class="mt-4 text-center">
                <a href="/ticketlist" class="btn btn-secondary">返回票券清單</a>
            </div>
        </div>
    </div>
    <script>
    localStorage.removeItem('cartTickets');
    </script>
</body>
</html>
