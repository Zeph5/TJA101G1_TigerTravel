<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>付款完成 - 訂單明細</title>
    <style>
        body {
            background: linear-gradient(135deg, #E6E6F2 0%, #F3F3FA 100%);
            min-height: 100vh;
            font-family: 'Noto Sans TC', 'Arial', sans-serif;
            color: #263241;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .main-card {
            background: rgba(255,255,255,0.97);
            border-radius: 18px;
            box-shadow: 0 4px 32px 0 rgba(102,126,234,0.08), 0 1.5px 10px 0 rgba(118,75,162,0.04);
            border: 1px solid rgba(102,126,234,0.09);
            padding: 2.5rem;
            margin-bottom: 2rem;
        }

        .page-title {
            color: #473992;
            font-weight: 700;
            font-size: 2.1rem;
            margin-bottom: 1.6rem;
            text-align: center;
            letter-spacing: 0.02em;
            position: relative;
        }

        .page-title::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 2px;
            bottom: -10px;
        }

        .success-indicator {
            text-align: center;
            margin-bottom: 2rem;
        }

        .success-icon {
            display: inline-block;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            margin-bottom: 1rem;
            position: relative;
        }

        .success-icon::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .section-title {
            color: #473992;
            font-weight: 700;
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            text-align: center;
            letter-spacing: 0.02em;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 2px;
            bottom: -8px;
        }

        .table {
            background: rgba(255,255,255,0.98);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.09);
            max-width: 700px;
            margin: 0 auto 2rem auto;
            width: 100%;
            border-collapse: collapse;
        }

        .table th, .table td {
            text-align: center;
            vertical-align: middle;
            padding: 1.1rem 0.6rem;
            min-width: 120px;
            border: none !important;
        }

        .table thead th {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            color: #473992;
            font-weight: 600;
        }

        .table tbody tr:nth-child(even) {
            background: rgba(102,126,234,0.02);
        }

        .order-summary {
            background: rgba(102,126,234,0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 2rem 0;
            border: 1px solid rgba(102,126,234,0.1);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(102,126,234,0.1);
        }

        .info-row:last-child {
            border-bottom: none;
            font-size: 1.1rem;
        }

        .info-label {
            font-weight: 600;
            color: #473992;
        }

        .info-value {
            color: #263241;
            font-weight: 500;
        }

        .total-amount {
            font-size: 1.2rem;
            font-weight: 700;
            color: #473992;
        }

        .btn-container {
            text-align: center;
            margin-top: 2rem;
        }

        .btn {
            border-radius: 12px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #336666);
            color: #fff !important;
            border: none;
            transition: box-shadow 0.2s, transform 0.1s;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.18);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover, .btn:focus {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 4px 20px rgba(102,126,234,0.23);
            filter: brightness(1.08);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem 0.5rem;
            }
            
            .main-card {
                padding: 1.5rem;
            }
            
            .page-title {
                font-size: 1.8rem;
            }
            
            .section-title {
                font-size: 1.2rem;
            }
            
            .table th, .table td {
                padding: 0.8rem 0.4rem;
                font-size: 0.9rem;
                min-width: 100px;
            }
            
            .info-row {
                flex-direction: column;
                align-items: flex-start;
                padding: 0.5rem 0;
            }
            
            .info-value {
                margin-top: 0.25rem;
            }
            
            .btn {
                width: 100%;
                margin-bottom: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">
            <div class="success-indicator">
                <div class="success-icon"></div>
            </div>
            
            <h1 class="page-title">付款完成</h1>
            
            <h2 class="section-title">訂單明細</h2>
            
            <table class="table">
                <thead>
                    <tr>
                        <th>品項名稱</th>
                        <th>數量</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 動態顯示訂單項目 -->
                    <tr th:each="item : ${orderItems}">
                        <td th:text="${item.name}">票券名稱</td>
                        <td th:text="${item.quantity}">數量</td>
                    </tr>
                </tbody>
            </table>

            <div class="order-summary">
                <div class="info-row">
                    <span class="info-label">總金額：</span>
                    <span class="info-value total-amount" th:text="${totalAmount} + ' 元'">總金額</span>
                </div>
                <div class="info-row">
                    <span class="info-label">會員帳號：</span>
                    <span class="info-value" th:text="${memberName}">會員名稱</span>
                </div>
                <div class="info-row">
                    <span class="info-label">下單時間：</span>
                    <span class="info-value" th:text="${orderTime}">下單時間</span>
                </div>
            </div>

            <div class="btn-container">
                <a href="/ticketlist" class="btn">返回票券清單</a>
            </div>
        </div>
    </div>
    
    <script>
        // 清空購物車資料 (使用變數儲存而非localStorage)
        localStorage.removeItem('cartTickets');
        window.cartTickets = null;
        console.log('購物車已清空');
    </script>
</body>
</html>
