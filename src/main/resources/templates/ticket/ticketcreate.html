<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增票券</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/unified.css">
</head>
<body>
<div class="container">
    <div class="form-container main-card">
        <h2 class="page-title">
            <i class="fas fa-ticket-alt"></i>
            新增票券
        </h2>
        <form th:action="@{/ticketcreate}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label class="form-label" for="ticketName">
                    <i class="fas fa-tag"></i> 票券名稱
                </label>
                <input type="text" class="form-control" id="ticketName" name="ticketName" placeholder="請輸入票券名稱" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="ticketDescription">
                    <i class="fas fa-align-left"></i> 票券描述
                </label>
                <textarea class="form-control" id="ticketDescription" name="ticketDescription" rows="3" placeholder="請輸入票券詳細描述"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label" for="ticketPrice">
                    <i class="fas fa-dollar-sign"></i> 價格
                </label>
                <div class="input-group">
                    <input type="number" class="form-control price-input" id="ticketPrice" name="ticketPrice" min="0" step="1" placeholder="0" required>
                    <span class="input-group-text">NT$</span>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="ticketStock">
                    <i class="fas fa-boxes"></i> 庫存
                </label>
                <input type="number" class="form-control" id="ticketStock" name="ticketStock" min="0" placeholder="庫存數量" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="ticketStatus">
                    <i class="fas fa-toggle-on"></i> 狀態
                </label>
                <select class="form-control" id="ticketStatus" name="ticketStatus">
                    <option value="1">有庫存</option>
                    <option value="0">無庫存</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="ticketImage">
                    <i class="fas fa-image"></i> 票券圖片
                </label>
                <div class="upload-area" onclick="document.getElementById('ticketImage').click();" style="cursor:pointer; border:2px dashed #e1e8ed; border-radius:12px; padding:1rem; text-align:center;">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 2rem; color: #667eea; margin-bottom: 0.5rem;"></i>
                    <div class="upload-text">點擊上傳圖片</div>
                    <div class="upload-subtext" style="color: #7f8c8d; font-size: 0.85rem;">支援 JPG, PNG, GIF 格式</div>
                </div>
                <input type="file" class="form-control-file" id="ticketImage" name="ticketImage" accept="image/*" style="display: none;">
                <img id="preview" class="img-preview mt-3" style="display:none; max-width:200px; max-height:120px; object-fit:contain; border-radius:12px; border:2px solid #e1e8ed; padding:8px; background:#fff;"/>
            </div>
            <div class="button-group d-flex justify-content-center gap-2 mt-4">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-plus-circle"></i> 新增票券
                </button>
                <a th:href="@{/ticketlist}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> 返回列表
                </a>
            </div>
        </form>
    </div>
</div>
<script>
document.getElementById('ticketImage').onchange = function (evt) {
    var [file] = this.files;
    var preview = document.getElementById('preview');
    if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        var uploadText = document.querySelector('.upload-text');
        var uploadSubtext = document.querySelector('.upload-subtext');
        uploadText.textContent = '已選擇: ' + file.name;
        uploadSubtext.textContent = '點擊重新選擇圖片';
    } else {
        preview.src = '';
        preview.style.display = 'none';
        document.querySelector('.upload-text').textContent = '點擊上傳圖片';
        document.querySelector('.upload-subtext').textContent = '支援 JPG, PNG, GIF 格式';
    }
};
document.querySelector('form').addEventListener('submit', function(e) {
    var submitBtn = document.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 處理中...';
    setTimeout(function() {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-plus-circle"></i> 新增票券';
    }, 5000);
});
</script>
</body>
</html>
