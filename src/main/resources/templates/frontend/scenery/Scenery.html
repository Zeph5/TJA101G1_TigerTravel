<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title th:text="${scenery.sceneryName}">Scenery Details</title>
<style>
  /* 主色系設定 */
  :root {
    --sky-blue: #B3E5FC;
    --egg-shell: #FDF6EC;
    --earth-yellow: #D9A441;
    --white: #ffffff;
    --light-gray: #f0f0f0;
    --border-color: #ccc;
  }

  body {
    background-color: var(--egg-shell);
    font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
    color: #333;
    margin: 0;
    padding: 20px;
  }

  h1, h2, h3, h4, h5 {
    color: var(--earth-yellow);
    font-weight: bold;
  }

  .container {
    background-color: var(--white);
    border-radius: 10px;
    padding: 30px;
    box-shadow: 0 0 12px rgba(0,0,0,0.05);
    max-width: 900px;
    margin: auto;
  }

  .banner-img {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .details {
    margin-top: 25px;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .stars {
    font-size: 1.5rem;
    color: gold;
  }

  .rating-number {
    margin-left: 8px;
    font-weight: bold;
    color: #666;
  }

  .info-item {
    margin: 10px 0;
  }

  hr {
    border-color: var(--border-color);
    margin: 25px 0;
  }

  .gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .gallery img {
    width: 120px;
    height: 80px;
    object-fit: cover;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    transition: transform 0.2s;
  }

  .gallery img:hover {
    transform: scale(1.1);
  }

  .info-item p {
    white-space: pre-wrap;
    line-height: 1.5;
    color: #444;
  }

  /* Modal styles */
  #modalOverlay {
    display: none;
    position: fixed;
    z-index: 9999;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
  }

  #modalOverlay img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 10px;
    box-shadow: 0 0 20px #000;
  }

  .close-btn {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 2.5rem;
    color: white;
    cursor: pointer;
    user-select: none;
  }

  /* Responsive adjustments */
  @media (max-width: 600px) {
    .header-row {
      flex-direction: column;
      align-items: flex-start;
    }

    .gallery img {
      width: 90px;
      height: 60px;
    }
  }
</style>
</head>
<body>

<div class="container">

  <img th:src="@{/scenery/banner/{id}(id=${scenery.sceneryId})}" alt="Banner" class="banner-img" />

  <div class="details">
    <div class="header-row">
      <h2 th:text="${scenery.sceneryName}">Scenery Name</h2>
      <div>
        <strong>Rating:</strong> 
        <span class="stars"> 
          <span th:each="i : ${#numbers.sequence(1,5)}">
            <span th:if="${scenery.rating >= i}">&#9733;</span>
            <span th:if="${scenery.rating < i and scenery.rating >= i - 0.5}" style="color: gold;">&#9733;</span> 
            <span th:if="${scenery.rating < i - 0.5}" style="color: #ddd;">&#9733;</span>
          </span>
        </span> 
        <span class="rating-number" th:text="${#numbers.formatDecimal(scenery.rating, 1, 1, 'POINT')}"></span>
      </div>
    </div>

    <div class="info-item">
      <strong>Address:</strong> <span th:text="${scenery.sceneryAddress}">Address</span>
    </div>

    <div class="info-item">
      <strong>Coordinates:</strong> 
      <span th:text="'Longitude: ' + ${scenery.sceneryLongitude} + ', Latitude: ' + ${scenery.sceneryLatitude}">Coordinates</span>
    </div>

    <hr />

    <h3>Gallery</h3>
    <div th:if="${scenery.sceneryImages != null and !scenery.sceneryImages.isEmpty()}" class="gallery">
      <img 
        th:each="img : ${scenery.sceneryImages}"
        th:src="@{/scenery/image/{id}(id=${img.sceneryImageId})}"
        alt="Scenery Image"
        th:attr="data-full=@{/scenery/image/{id}(id=${img.sceneryImageId})}"
        onclick="openModal(this)" />
    </div>
    <div th:if="${scenery.sceneryImages == null or scenery.sceneryImages.isEmpty()}">
      <p>No images available for this scenery.</p>
    </div>

    <hr />

    <div class="info-item">
      <strong>Introduction:</strong>
      <p th:utext="${#strings.replace(scenery.sceneryIntro, '\n', '<br/>')}">Intro</p>
    </div>
  </div>

</div>

<!-- Modal overlay -->
<div id="modalOverlay" onclick="closeModal(event)">
  <span class="close-btn" onclick="closeModal(event)">&times;</span>
  <img id="modalImage" src="" alt="Full Size Image" />
</div>

<script>
function openModal(imgElement) {
  const modal = document.getElementById('modalOverlay');
  const modalImg = document.getElementById('modalImage');
  modalImg.src = imgElement.getAttribute('data-full');
  modal.style.display = 'flex';
}

function closeModal(event) {
  if(event.target.id === 'modalOverlay' || event.target.classList.contains('close-btn')) {
    document.getElementById('modalOverlay').style.display = 'none';
  }
}

document.addEventListener('keydown', function(event) {
  if(event.key === "Escape") {
    document.getElementById('modalOverlay').style.display = 'none';
  }
});
</script>

</body>
</html>
