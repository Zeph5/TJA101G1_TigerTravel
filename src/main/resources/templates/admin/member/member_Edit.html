<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>編輯會員</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>編輯會員</h2>
    <form th:action="@{'/admin/members/edit/' + ${member.memberId}}" th:object="${member}" method="post">
        <div class="mb-3">
            <label class="form-label">姓名</label>
            <input type="text" th:field="*{memberName}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{memberEmail}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label class="form-label">電話</label>
            <input type="text" th:field="*{memberPhone}" class="form-control"/>
        </div>
        <button type="submit" class="btn btn-success">儲存變更</button>
        <a th:href="@{'/admin/members/' + ${member.memberId}}" class="btn btn-secondary">取消</a>
    </form>
</div>
</body>
</html>
