
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant"
	th:replace="~{layout :: layout (~{::title}, ~{::main}, ~{::cssLinks})}">

<head>
<meta charset="UTF-8">
<th:block th:fragment="title">會員清單</th:block>
<th:block th:fragment="cssLinks">
	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
		rel="stylesheet">
	<link
		href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
		rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/admin-theme.css}" />
</th:block>
<style>
/* 狀態標籤 */
.status-active {
	background-color: #e0f4e9;
	color: #28a745;
	font-weight: bold;
	padding: 4px 12px;
	border-radius: 16px;
	font-size: 0.875rem;
}

.status-inactive {
	background-color: #fdecea;
	color: #dc3545;
	font-weight: bold;
	padding: 4px 12px;
	border-radius: 16px;
	font-size: 0.875rem;
}

.top-actions {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 1.5rem;
}

/* 搜尋欄列間距與樣式 */
.filter-bar {
	display: flex;
	gap: 1rem;
	flex-wrap: wrap;
	margin-bottom: 1.25rem;
	align-items: center;
}

.filter-bar input {
	width: 240px;
}

.filter-bar .form-control, .filter-bar .form-select {
	max-width: 220px;
}

.action-buttons .btn {
	margin-right: 4px;
}

/* 表格樣式 */
.table {
	border-radius: 12px;
	overflow: hidden;
	background-color: #fff;
	box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
}

.table th {
	background-color: #f1f3f5;
	color: #495057;
}

.table td {
	vertical-align: middle;
}

table.table thead th {
	background-color: #f1f3f5;
	color: #343a40;
}

table.table tbody tr:hover {
	background-color: #f9fafb;
}
/* 行動裝置相容 */
@media ( max-width : 768px) {
	.filter-bar {
		flex-direction: column;
		align-items: stretch;
	}
	.table-responsive {
		overflow-x: auto;
	}
}
</style>
</head>

<main>
	<div class="container py-4">
		<div class="top-actions">
			<h3 class="fw-bold text-white bg-primary px-4 py-2 rounded">會員清單</h3>

		</div>
		

		<!-- 🔍 篩選列 -->
		<form method="get" th:action="@{/admin/members/list}"
			class="filter-bar">

			<!-- 🔍 關鍵字 -->
			<input type="text" class="form-control" name="keyword"
				placeholder="輸入姓名、電話、帳號" th:value="${keyword}">

			<!-- 🔽 狀態下拉 -->
			<select name="status" class="form-select">
				<option value="">全部狀態</option>
				<option value="1" th:selected="${status == '1'}">啟用中</option>
				<option value="0" th:selected="${status == '0'}">停權</option>
			</select>

			<!-- 🔎 查詢 -->
			<button type="submit" class="btn btn-outline-secondary">
				<i class="fa-solid fa-magnifying-glass me-1"></i> 搜尋
			</button>
		</form>



		<!-- 📋 表格 -->
		<div class="table-responsive">
			<table class="table table-bordered text-center align-middle mt-3">
				<thead class="table-light">
					<tr>
						<th>#</th>
						<th>帳號</th>
						<th>姓名</th>
						<th>Email</th>
						<th>電話</th>
						<th>狀態</th>
						<th>註冊時間</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="member : ${members}">
						<td th:text="${member.memberId}">1</td>
						<td th:text="${member.memberAccount}">test123</td>
						<td th:text="${member.memberName}">王小明</td>
						<td th:text="${member.memberEmail}">test@email.com</td>
						<td th:text="${member.memberPhone}">0912345678</td>
						<td><span
							th:class="${member.memberStatus == 1 ? 'status-active' : 'status-inactive'}"
							th:text="${member.memberStatus == 1 ? '啟用中' : '停用'}">啟用中</span></td>
						<td
							th:text="${#dates.format(member.createTime, 'yyyy/MM/dd HH:mm:ss')}">2025/01/22
							上午08:38:23</td>
						<td class="action-buttons"><a
							th:href="@{'/admin/members/' + ${member.memberId}}"
							class="btn btn-sm btn-outline-primary"> <i
								class="fa-solid fa-eye"></i> 詳細
						</a>
							<form
								th:action="@{'/admin/members/disable/' + ${member.memberId}}"
								method="post" class="d-inline"
								onsubmit="return confirm('確定要切換狀態嗎？')">
								<button type="submit"
									th:class="'btn btn-sm ' + (member.memberStatus == 1 ? 'btn-danger' : 'btn-success')">
									<i
										th:class="'fa-solid ' + (member.memberStatus == 1 ? 'fa-ban' : 'fa-check')"></i>
									<span th:text="${member.memberStatus == 1 ? '停權' : '啟用'}"></span>
								</button>
							</form></td>
					</tr>
				</tbody>
			</table>
		</div>

		<!-- ⏩ 分頁 -->
		<div
			th:replace="fragments/pagination :: pagination( ${memberPage}, ${currentPage}, ${pageSize}, ${keyword})"></div>


	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</main>

</html>
