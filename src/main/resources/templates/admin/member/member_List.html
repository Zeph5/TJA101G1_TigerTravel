<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>會員清單</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">會員清單</h2>
    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>帳號</th>
                <th>姓名</th>
                <th>Email</th>
                <th>電話</th>
                <th>狀態</th>
                <th>註冊時間</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="member : ${members}">
                <td th:text="${member.memberId}">1</td>
                <td th:text="${member.memberAccount}">test123</td>
                <td th:text="${member.memberName}">王小明</td>
                <td th:text="${member.memberEmail}">test@email.com</td>
                <td th:text="${member.memberPhone}">0912345678</td>
                <td th:text="${member.memberStatus == 1 ? '啟用' : '停用'}">啟用</td>
                <td th:text="${#dates.format(member.createTime, 'yyyy-MM-dd HH:mm')}">2025-07-17</td>
                <td>
                    <a th:href="@{'/admin/members/' + ${member.memberId}}" class="btn btn-sm btn-info">詳情</a>
                    <a th:href="@{'/admin/members/edit/' + ${member.memberId}}" class="btn btn-sm btn-info">編輯</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
