<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>票券管理</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<style>
.ticket-card img {
	max-height: 120px;
	object-fit: cover;
}

.ticket-card {
	margin-bottom: 30px;
}
</style>
</head>
<body>
	<div class="container my-4">
		<div class="row mb-3">
			<div class="col-md-6 offset-md-3">
				<input type="text" id="searchInput" class="form-control"
					placeholder="搜尋票券名稱...">
			</div>
			<div class="col-md-3 text-right">
				<a th:href="@{/admin/ticketcreate}" class="btn btn-success"> <i
					class="fas fa-plus-circle"></i> 新增票券
				</a>
			</div>
		</div>
		<h2 class="mb-4 text-center">票券管理</h2>
		<div class="row">
			<div th:each="ticket : ${tickets}"
				class="col-md-6 col-lg-4 ticket-card">
				<div class="card h-100 shadow-sm">
					<div class="card-img-top text-center bg-light"
						style="height: 140px;">
						<img th:if="${ticket.ticketImage != null}"
							th:with="imageBase64=${T(org.apache.tomcat.util.codec.binary.Base64).encodeBase64String(ticket.ticketImage)}"
							th:src="${'data:image/jpeg;base64,'} + ${imageBase64}"
							class="img-fluid h-100" alt="票券圖片" /> <span
							th:if="${ticket.ticketImage == null}"
							class="text-muted align-middle">無圖片</span>
					</div>
					<div class="card-body">
						<h5 class="card-title" th:text="${ticket.ticketName}">票券名稱</h5>
						<p class="card-text" th:text="${ticket.ticketDescription}">票券描述</p>
					</div>
					<ul class="list-group list-group-flush">
						<li class="list-group-item">價格：<span
							th:text="${ticket.ticketPrice}">0</span> 元
						</li>
						<li class="list-group-item">庫存：<span
							th:text="${ticket.ticketStock}"></span></li>
						<li class="list-group-item">狀態： <span
							th:text="${ticket.ticketStatus == 1 ? '有庫存' : '無庫存'}"
							th:classappend="${ticket.ticketStatus == 1 ? 'text-success' : 'text-danger'}"></span>
						</li>
					</ul>
					<div class="card-footer text-center bg-white border-0">
						<button type="button" class="btn btn-warning btn-sm"
							data-toggle="modal"
							th:data-target="'#editModal_' + ${ticket.ticketId}">編輯</button>
						<form th:action="@{'/admin/ticket/delete/' + ${ticket.ticketId}}"
							method="post" style="display: inline;"
							onsubmit="return confirm('確定要刪除這張票券？');">
							<button type="submit" class="btn btn-danger btn-sm ml-2">刪除</button>
						</form>
					</div>
				</div>
				<!-- 編輯彈窗 -->
				<div class="modal fade" th:id="'editModal_' + ${ticket.ticketId}"
					tabindex="-1" role="dialog">
					<div class="modal-dialog modal-lg" role="document">
						<div class="modal-content">
							<form th:action="@{/admin/ticket/edit}" method="post"
								enctype="multipart/form-data">
								<div class="modal-header">
									<h5 class="modal-title">編輯票券</h5>
									<button type="button" class="close" data-dismiss="modal">
										<span>&times;</span>
									</button>
								</div>
								<div class="modal-body">
									<input type="hidden" name="ticketId"
										th:value="${ticket.ticketId}" />
									<div class="form-group">
										<label>票券名稱</label> <input type="text" name="ticketName"
											th:value="${ticket.ticketName}" class="form-control" required />
									</div>
									<div class="form-group">
										<label>價格</label> <input type="number" step="0.01"
											name="ticketPrice" th:value="${ticket.ticketPrice}"
											class="form-control" required />
									</div>
									<div class="form-group">
										<label>庫存</label> <input type="number" name="ticketStock"
											th:value="${ticket.ticketStock}" class="form-control"
											required />
									</div>
									<div class="form-group">
										<label>描述</label>
										<textarea name="ticketDescription" class="form-control"
											th:text="${ticket.ticketDescription}"></textarea>
									</div>
									<div class="form-group">
										<label>狀態</label> <select name="ticketStatus"
											class="form-control">
											<option value="1" th:selected="${ticket.ticketStatus == 1}">有庫存</option>
											<option value="0" th:selected="${ticket.ticketStatus == 0}">無庫存</option>
										</select>
									</div>
									<div class="form-group">
										<label>票券圖片</label> <input type="file" name="ticketImage"
											class="form-control-file" />
										<div th:if="${ticket.ticketImage != null}">
											<img
												th:with="imageBase64=${T(org.apache.tomcat.util.codec.binary.Base64).encodeBase64String(ticket.ticketImage)}"
												th:src="${'data:image/jpeg;base64,'} + ${imageBase64}"
												style="max-height: 100px;" />
										</div>
									</div>
								</div>
								<div class="modal-footer">
									<button type="submit" class="btn btn-primary">儲存變更</button>
									<button type="button" class="btn btn-secondary"
										data-dismiss="modal">取消</button>
								</div>
							</form>
						</div>
					</div>
				</div>
				<!-- /modal -->
			</div>
		</div>
	</div>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
	<script>
$(document).ready(function() {
    $('#searchInput').on('input', function() {
        var keyword = $(this).val().toLowerCase();
        $('.ticket-card').each(function() {
            var title = $(this).find('.card-title').text().toLowerCase();
            if (title.includes(keyword)) {
                $(this).show();
            } else {
                $(this).hide();
            }
        });
    });
});
</script>
</body>
</html>
