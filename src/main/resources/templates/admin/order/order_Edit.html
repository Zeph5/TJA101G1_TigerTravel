<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant"
th:replace="~{layout :: layout (~{::title}, ~{::body}, ~{})}">
<head>
  <meta charset="UTF-8">
  <th:block th:fragment="title">編輯訂單</th:block>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap 5 + Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />

  <!-- 共用後台主題 -->
  <link rel="stylesheet" href="/css/admin-theme.css" />

  <style>
    body {
      background-color: #f5f7fa;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      padding: 3rem 1rem;
    }

    .form-wrapper {
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      padding: 3rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h2 {
      font-weight: 700;
      color: #2f3e46;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .form-label i {
      margin-right: 0.5rem;
      color: #6c757d;
    }

    .form-control[readonly] {
      background-color: #f8f9fa;
      cursor: not-allowed;
    }

    .btn + .btn {
      margin-left: 0.5rem;
    }

    .btn-outline-secondary i {
      margin-right: 0.3rem;
    }

    .btn-success i {
      margin-right: 0.3rem;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="form-wrapper">
    <h2><i class="bi bi-pencil-square"></i> 編輯訂單</h2>

    <form th:action="@{/admin/orders/edit/{id}(id=${order.tourOrderId})}" method="post">
      <input type="hidden" name="tourOrderId" th:value="${order.tourOrderId}" />

      <!-- 會員名稱 -->
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-person-circle"></i> 會員名稱</label>
        <input type="text" class="form-control" th:value="${order.memberName}" readonly />
      </div>

      <!-- 行程編號 -->
      <div class="mb-3">
        <label for="travelItineraryId" class="form-label"><i class="bi bi-map"></i> 行程編號</label>
        <input type="number" id="travelItineraryId" name="travelItineraryId" class="form-control"
               th:value="${order.travelItineraryId}" required />
      </div>

      <!-- 旅客人數 -->
      <div class="mb-3">
        <label for="peopleCount" class="form-label"><i class="bi bi-people-fill"></i> 旅客人數</label>
        <input type="number" id="peopleCount" name="peopleCount" class="form-control"
               th:value="${order.peopleCount}" min="1" required />
      </div>

      <!-- 總金額 -->
      <div class="mb-3">
        <label for="totalAmount" class="form-label"><i class="bi bi-cash-coin"></i> 總金額 (元)</label>
        <input type="number" id="totalAmount" name="totalAmount" class="form-control"
               th:value="${order.totalAmount}" min="0" required />
      </div>

      <!-- 訂單狀態 -->
      <div class="mb-3">
        <label for="tourOrderStatus" class="form-label"><i class="bi bi-flag"></i> 訂單狀態</label>
        <select id="tourOrderStatus" name="tourOrderStatus" class="form-select">
          <option value="未付款" th:selected="${order.tourOrderStatus == '未付款'}">未付款</option>
          <option value="已付款" th:selected="${order.tourOrderStatus == '已付款'}">已付款</option>
          <option value="已取消" th:selected="${order.tourOrderStatus == '已取消'}">已取消</option>
        </select>
      </div>

      <!-- 建立時間 -->
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-clock-history"></i> 建立時間</label>
        <input type="text" class="form-control" th:value="${#temporals.format(order.createTime, 'yyyy-MM-dd HH:mm')}" readonly />
      </div>

      <!-- 按鈕區 -->
      <div class="mt-4 d-flex justify-content-between">
        <a th:href="@{/admin/orders/list}" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left-circle"></i> 返回清單
        </a>
        <button type="submit" class="btn btn-success">
          <i class="bi bi-save"></i> 儲存變更
        </button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
