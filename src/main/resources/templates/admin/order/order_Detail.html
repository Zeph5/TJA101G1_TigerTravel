<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>訂單詳情</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 圖示庫（可選） -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .card-title i {
            margin-right: 8px;
        }
        .badge {
            font-size: 0.95em;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <h2 class="mb-4"><i class="fa-solid fa-file-invoice"></i> 訂單詳情</h2>

    <!-- 基本訂單資訊 -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title"><i class="fa-solid fa-circle-info"></i> 基本資訊</h5>
            <ul class="list-group list-group-flush">
                <li class="list-group-item">訂單編號：<strong th:text="${order.tourOrderId}">12345</strong></li>
                <li class="list-group-item">訂單狀態：
                    <span th:classappend="${order.tourOrderStatus == '已付款' ? 'status-paid' : 
                               (order.tourOrderStatus == '未付款' ? 'status-pending' : 
                               (order.tourOrderStatus == '已取消' ? 'status-cancelled' : 'status-default'))}"
      th:text="${order.tourOrderStatus}" class="order-status-badge">未付款</span>
                </li>
                <li class="list-group-item">行程編號：<span th:text="${order.travelItineraryId}">T2025</span></li>
                <li class="list-group-item">旅客人數：<span th:text="${order.peopleCount}">2</span> 人</li>
            </ul>
        </div>
    </div>

    <!-- 返回按鈕 -->
    <div class="mt-4">
        <a href="/admin/orders/list" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left"></i> 返回訂單列表
        </a>
    </div>
</div>

<!-- Bootstrap 5 JS (必要時用) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</html>
