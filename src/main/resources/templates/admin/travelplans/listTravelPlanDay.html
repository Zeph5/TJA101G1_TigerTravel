<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>每日行程列表與編輯</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet" />

<style>
body {
	margin: 20px;
}

.date-select {
	margin-bottom: 20px;
}
</style>
</head>
<body>
	<div class="container">

		<h2>每日行程列表</h2>

		<p>
			旅程期間：<strong th:text="${startDate}">2025-07-01</strong> ~ <strong
				th:text="${endDate}">2025-07-07</strong>
		</p>

		<!-- 日期選擇 -->
		<form method="get"
			th:action="@{/admin/travelplans/{planId}/itinerary/{itineraryId}/days(planId=${travelPlanId}, itineraryId=${travelItineraryId})}">
			<div class="date-select">
				<label for="dateSelect">選擇日期編輯行程：</label> <select id="dateSelect"
					name="date" class="form-select" onchange="this.form.submit()">
					<option th:each="date : ${itineraryDates}" th:value="${date}"
						th:text="${date}" th:selected="${date == currentEditDate}">
					</option>
				</select>
			</div>
		</form>
		<div class="mb-3">
			<a
				th:href="@{/admin/travelplans/{planId}/itinerary/{itineraryId}/days/new(planId=${travelPlanId}, itineraryId=${travelItineraryId})}"
				class="btn btn-success"> ➕ 新增每日行程 </a>
		</div>

		<!-- 顯示每日行程清單 -->
		<table class="table table-bordered table-hover">
			<thead>
				<tr>
					<th>序號</th>
					<th>旅程天數</th>
					<th>行程序號</th>
					<th>旅行日期</th>
					<th>景點名稱</th>
					<th>建立時間</th>
					<th>編輯</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="day, iterStat : ${travelPlanDays}">
					<td th:text="${iterStat.count}">1</td>
					<td th:text="${day.travelDayNumber}">1</td>
					<td th:text="${day.travelSequenceNumber}">1</td>
					<td th:text="${#temporals.format(day.traveltime, 'yyyy-MM-dd')}">2025-07-12</td>
					<td
						th:text="${day.scenery != null ? day.scenery.sceneryName : '無'}">日月潭</td>
					<td
						th:text="${#temporals.format(day.createtime, 'yyyy-MM-dd HH:mm')}">2025-07-01
						12:00</td>
					<td><a
						th:href="@{/admin/travelplans/{planId}/itinerary/{itineraryId}/days/edit/{travelPlanDayId}(planId=${travelPlanId}, itineraryId=${travelItineraryId}, travelPlanDayId=${day.travelPlanDayId})}"
						class="btn btn-sm btn-primary">編輯</a> <a
							th:href="@{|/admin/travelplans/${travelPlanId}/itinerary/${travelItineraryId}/days/${day.travelPlanDayId}/delete?date=${currentEditDate}|}"
							class="btn btn-sm btn-danger"
							onclick="return confirm('確定要刪除這筆行程嗎？')"> 刪除 </a>
				</tr>
				<tr th:if="${#lists.isEmpty(travelPlanDays)}">
					<td colspan="7" class="text-center">目前沒有任何行程資料</td>
				</tr>
			</tbody>
		</table>

		<hr />



		<script>
			// Bootstrap 表單驗證
			(function() {
				'use strict'
				window.addEventListener('load', function() {
					var forms = document
							.getElementsByClassName('needs-validation')
					Array.prototype.filter.call(forms, function(form) {
						form.addEventListener('submit', function(event) {
							if (form.checkValidity() === false) {
								event.preventDefault()
								event.stopPropagation()
							}
							form.classList.add('was-validated')
						}, false)
					})
				}, false)
			})()
		</script>
</body>
</html>
