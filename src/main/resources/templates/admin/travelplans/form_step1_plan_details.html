<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant"
	th:replace="~{layout :: layout (~{::title}, ~{::body}, ~{})}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<th:block th:fragment="title">新增/編輯旅行計畫</th:block>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body {
	padding-top: 50px;
	background-color: #f8f9fa;
}

.container {
	max-width: 700px;
	background-color: #fff;
	padding: 30px;
	border-radius: 8px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

h2 {
	text-align: center;
	margin-bottom: 30px;
	color: #333;
}

.error-message {
	color: red;
	font-size: 0.875em;
	margin-top: 0.25em;
}

.required {
	color: red;
}
</style>
</head>
<body>
	<div class="container">
		<h2>新增/編輯旅行計畫 - 步驟 1: 旅行計畫</h2>
		<p class="text-muted text-center">請輸入旅行計畫的基本資訊。</p>

		<div th:if="${successMessage}" class="alert alert-success"
			role="alert" th:text="${successMessage}"></div>
		<div th:if="${errorMessage}" class="alert alert-danger" role="alert"
			th:text="${errorMessage}"></div>

		<form th:action="@{/admin/travelplans/save}"
			th:object="${travelPlanCreationDto}" method="post"
			enctype="multipart/form-data">
			<input type="hidden" th:field="*{travelPlanId}" />

			<div class="mb-3">
				<label for="travelTitle" class="form-label">標題: <span
					class="required">*</span></label> <input type="text" id="travelTitle"
					th:field="*{travelTitle}" class="form-control" required
					maxlength="100" placeholder="請輸入旅行計畫標題..." />
				<p th:if="${#fields.hasErrors('travelTitle')}"
					th:errors="*{travelTitle}" class="error-message"></p>
			</div>

			<div class="mb-3">
				<label for="travelPlanDescription" class="form-label">描述: <span
					class="required">*</span></label>
				<textarea id="travelPlanDescription"
					th:field="*{travelPlanDescription}" class="form-control" rows="4"
					required minlength="10" maxlength="1000" placeholder="請輸入旅行計畫描述..."></textarea>
				<p th:if="${#fields.hasErrors('travelPlanDescription')}"
					th:errors="*{travelPlanDescription}" class="error-message"></p>
			</div>

			<div class="mb-3">
				<label for="bannerImage" class="form-label">橫幅圖片:</label>

				<!-- 顯示原本已上傳的圖片（可有可無） -->
				<img th:src="@{${travelPlanCreationDto.travelPlanBannerUrl}}"
					alt="目前橫幅圖" class="img-thumbnail"
					style="max-width: 200px; height: auto;" id="existingBannerPreview" />


				<!-- 一定出現的圖片上傳欄位 -->
				<label for="bannerImage" class="form-label mt-3">橫幅圖片上傳:</label> <input
					type="file" id="bannerImage" name="bannerImage"
					class="form-control" accept="image/*"
					onchange="previewNewBannerImage()" />
				<div class="form-text">支援格式：JPG, PNG, GIF (最大 5MB)</div>

				<!-- 即時預覽新圖片 -->
				<div class="mt-2" id="newBannerPreviewBlock" style="display: none;">
					<p>新圖片預覽：</p>
					<img id="newBannerPreview" class="img-thumbnail"
						style="max-width: 200px;">
				</div>

				<!-- 錯誤訊息 -->
				<p th:if="${#fields.hasErrors('bannerImage')}"
					th:errors="*{bannerImage}" class="error-message"></p>
			</div>


			<div class="d-grid gap-2 mt-4">
				<button type="submit" class="btn btn-primary btn-lg">完成</button>
				<a href="/admin/travelplans" class="btn btn-secondary">取消</a>
			</div>
		</form>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		function previewNewBannerImage() {
			const input = document.getElementById('bannerImage');
			const previewBlock = document
					.getElementById('newBannerPreviewBlock');
			const previewImg = document.getElementById('newBannerPreview');

			if (input.files && input.files[0]) {
				const reader = new FileReader();
				reader.onload = function(e) {
					previewImg.src = e.target.result;
					previewBlock.style.display = 'block';
				};
				reader.readAsDataURL(input.files[0]);
			}
		}
	</script>
</body>
</html>
