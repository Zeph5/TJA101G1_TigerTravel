<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>旅行計畫管理</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin-theme.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: bold;
            color: #0d6efd;
            text-align: center;
            margin-bottom: 2rem;
        }

        .top-header {
            position: relative;
        }

        .home-btn {
            position: absolute;
            right: 0;
            top: -15px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card-checkbox-wrapper {
            position: relative;
        }

        .card-checkbox {
            position: absolute;
            top: -10px;
            left: -10px;
            z-index: 10;
        }

        .card {
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            transition: transform 0.25s ease;
            border: none;
            background-color: #fff;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        .card-img-top {
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            object-fit: cover;
            height: 160px;
        }

        .card-title {
            color: #0d6efd;
            font-weight: 600;
        }

        .card-footer {
            font-size: 0.875rem;
            color: #6c757d;
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }

        .btn-sm {
            font-size: 0.85rem;
            border-radius: 6px;
        }

        .alert {
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>

<!-- 🔝 Title 與返回首頁 -->
<div class="top-header mb-3">
    <h1>旅行計畫列表</h1>
    <a th:href="@{/admin/index}" class="btn btn-outline-primary home-btn">🏠 回首頁</a>
</div>

<!-- ✅ 成功或錯誤提示 -->
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
<div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

<!-- 🔧 功能操作列 -->
<div class="top-bar">
    <a th:href="@{/admin/travelplans/new}" class="btn btn-success">➕ 新增旅行計畫</a>

    <div>
        <form id="deleteForm" th:action="@{/admin/travelplans/batch-delete}" method="post"
              onsubmit="return confirm('確定要刪除選取的旅行計畫嗎？');" class="d-inline">
            <button type="submit" class="btn btn-danger">🗑 刪除選取的旅行計畫</button>
        </form>
        <button type="button" id="selectAllBtn" class="btn btn-outline-primary ms-2">✔ 一鍵選取</button>
    </div>
</div>

<!-- 📦 卡片區塊 -->
<div class="card-grid">
    <div class="card-checkbox-wrapper" th:each="plan : ${travelPlans}">
        <div class="card-checkbox">
            <input type="checkbox" name="planIds" th:value="${plan.travelPlanId}">
        </div>

        <div class="card">
            <img th:if="${plan.travelPlanBannerUrl}" th:src="@{${plan.travelPlanBannerUrl}}" class="card-img-top" alt="Banner">
            <div class="card-body">
                <h5 class="card-title" th:text="${plan.travelTitle}">旅行標題</h5>
                <p class="card-text" th:text="${plan.travelPlanDescription}">旅行描述</p>
            </div>
            <div class="card-footer">
                <div>
                    發布：<span th:text="${#temporals.format(plan.publishedDate, 'yyyy-MM-dd')}">2025-01-01</span>，
                    修改：<span th:text="${#temporals.format(plan.lastModifiedDate, 'yyyy-MM-dd')}">2025-01-02</span>
                </div>
                <div class="card-actions mt-2">
                    <a th:href="@{/admin/travelplans/{id}/edit(id=${plan.travelPlanId})}" class="btn btn-sm btn-outline-primary">編輯</a>
                    <form th:action="@{/admin/travelplans/{id}/delete(id=${plan.travelPlanId})}" method="post"
                          style="display:inline;" onsubmit="return confirm('您確定要刪除這個旅行計畫嗎？');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">刪除</button>
                    </form>
                    <a th:href="@{/admin/travelplans/{id}/itinerary(id=${plan.travelPlanId})}" class="btn btn-sm btn-outline-secondary">詳情</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 空狀態提示 -->
<div th:if="${#lists.isEmpty(travelPlans)}" class="text-center text-muted mt-4">
    <p>目前沒有旅行計畫。</p>
</div>

<!-- JS -->
<script>
    let allSelected = false;
    document.getElementById('selectAllBtn').addEventListener('click', function () {
        const checkboxes = document.querySelectorAll('input[name="planIds"]');
        allSelected = !allSelected;
        checkboxes.forEach(cb => cb.checked = allSelected);
        this.textContent = allSelected ? '✖ 取消全選' : '✔ 一鍵選取';
    });

    document.getElementById('deleteForm').addEventListener('submit', function (e) {
        const checked = document.querySelectorAll('input[name="planIds"]:checked');
        if (checked.length === 0) {
            alert('請先選取要刪除的旅行計畫');
            e.preventDefault();
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
