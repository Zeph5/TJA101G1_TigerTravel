<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant"
th:replace="~{layout :: layout (~{::title}, ~{::body}, ~{})}">
<head>
    <th:block th:fragment="title">旅行計畫管理</th:block>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin-theme.css" rel="stylesheet">

</head>
<body>
    <!-- 主體區塊 -->
    <div class="flex-grow-1 p-4" style="background-color: #f4f6f9; min-height: 100vh;">
        <div class="container">

            <!-- 🔝 Title 與返回首頁 -->
            <div class="position-relative mb-4">
                <h1 class="text-primary text-center fw-bold">旅行計畫列表</h1>
               
            </div>

            <!-- ✅ 成功或錯誤提示 -->
            <div th:if="${successMessage}" class="alert alert-success rounded" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger rounded" th:text="${errorMessage}"></div>

            <!-- 🔧 功能操作列 -->
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
                <a th:href="@{/admin/travelplans/new}" class="btn btn-success">➕ 新增旅行計畫</a>

                <div class="d-flex flex-wrap gap-2">
                    <form id="deleteForm" th:action="@{/admin/travelplans/batch-delete}" method="post"
                          onsubmit="return confirm('確定要刪除選取的旅行計畫嗎？');">
                        <button type="submit" class="btn btn-danger">🗑 刪除選取</button>
                    </form>
                    <button type="button" id="selectAllBtn" class="btn btn-outline-primary">✔ 一鍵選取</button>
                </div>
            </div>

            <!-- 📦 卡片區塊 -->
            <div class="row g-4">
                <div class="col-md-6 col-lg-4" th:each="plan : ${travelPlans}">
                    <div class="position-relative">
                        <input type="checkbox" name="planIds" th:value="${plan.travelPlanId}"
                               class="form-check-input position-absolute top-0 start-0 m-2 z-3">

                        <div class="card h-100 shadow-sm rounded-4">
                            <img th:if="${plan.travelPlanBannerUrl}" th:src="@{${plan.travelPlanBannerUrl}}"
                                 class="card-img-top rounded-top-4 object-fit-cover" style="height: 180px;" alt="Banner">

                            <div class="card-body">
                                <h5 class="card-title text-primary fw-semibold" th:text="${plan.travelTitle}">標題</h5>
                                <p class="card-text text-secondary" th:text="${plan.travelPlanDescription}">描述</p>
                            </div>

                            <div class="card-footer bg-light text-muted small d-flex flex-column gap-2">
                                <div>
                                    發布：<span th:text="${#temporals.format(plan.publishedDate, 'yyyy-MM-dd')}">-</span>，
                                    修改：<span th:text="${#temporals.format(plan.lastModifiedDate, 'yyyy-MM-dd')}">-</span>
                                </div>

                                <div class="btn-group gap-1" role="group">
                                    <a th:href="@{/admin/travelplans/{id}/edit(id=${plan.travelPlanId})}"
                                       class="btn btn-sm btn-outline-primary">編輯</a>

                                    <form th:action="@{/admin/travelplans/{id}/delete(id=${plan.travelPlanId})}"
                                          method="post" onsubmit="return confirm('確定要刪除嗎？');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">刪除</button>
                                    </form>

                                    <a th:href="@{/admin/travelplans/{id}/itinerary(id=${plan.travelPlanId})}"
                                       class="btn btn-sm btn-outline-secondary">詳情</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 空狀態 -->
            <div th:if="${#lists.isEmpty(travelPlans)}" class="text-center text-muted mt-5 fs-5">
                <p>目前沒有旅行計畫。</p>
            </div>
        </div>
    </div>
</div>

<!-- JS -->
<script>
    let allSelected = false;
    document.getElementById('selectAllBtn').addEventListener('click', function () {
        const checkboxes = document.querySelectorAll('input[name="planIds"]');
        allSelected = !allSelected;
        checkboxes.forEach(cb => cb.checked = allSelected);
        this.textContent = allSelected ? '✖ 取消全選' : '✔ 一鍵選取';
    });

    document.getElementById('deleteForm').addEventListener('submit', function (e) {
        const checked = document.querySelectorAll('input[name="planIds"]:checked');
        if (checked.length === 0) {
            alert('請先選取要刪除的旅行計畫');
            e.preventDefault();
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
