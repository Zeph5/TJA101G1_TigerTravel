<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>編輯每日行程</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>行程明細</h2>
    <p>
        旅程期間：
        <strong th:text="${startDate}">2025-07-01</strong> ~
        <strong th:text="${endDate}">2025-07-07</strong>
    </p>

    <form th:action="@{/admin/travelplans/{planId}/itinerary/{itineraryId}/days/save(planId=${travelPlanId}, itineraryId=${travelItineraryId})}" 
          method="post" id="dailyForm">

        <div id="itineraryItems">
            <div th:each="item, iterStat : *{dailyItems}" class="row mb-3 border p-2 itinerary-row">
                <input type="hidden" th:name="|dailyItems[${iterStat.index}].travelPlanDayId|" th:value="${item.travelPlanDayId}" />

                <label>景點：</label>
                <select th:name="|dailyItems[${iterStat.index}].sceneryId|" class="form-select" required
                        th:attr="onchange=|updateSceneryName(this, ${iterStat.index})|">
                    <option value="">請選擇景點</option>
                    <option th:each="entry : ${allSceneries}" th:value="${entry.key}" th:text="${entry.value}" 
                            th:selected="${entry.key} == ${item.sceneryId}"></option>
                </select>

                <label>景點名稱：</label>
                <input type="text" th:name="|dailyItems[${iterStat.index}].sceneryName|" th:value="${item.sceneryName}" class="form-control" readonly />

                <label>旅遊日期：</label>
                <input type="date" 
                       th:name="|dailyItems[${iterStat.index}].traveltime|" 
                       th:value="${item.traveltime}" 
                       class="form-control" required 
                       th:min="${startDate}" th:max="${endDate}" />

                <label>行程順序：</label>
                <input type="number" th:name="|dailyItems[${iterStat.index}].travelSequenceNumber|" 
                       th:value="${item.travelSequenceNumber}" class="form-control" min="1" required />

                <div class="text-end mt-2">
                    <button type="button" class="btn btn-danger btn-sm" onclick="removeRow(this)">🗑 刪除</button>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-success">💾 儲存行程</button>
            <button type="button" class="btn btn-secondary" onclick="addNewRow()">➕ 新增一行</button>
            <button type="button" class="btn btn-outline-danger" onclick="clearAllRows()">🧹 清除全部</button>
            <a th:href="@{|/admin/travelplans/${travelPlanId}/itinerary/${travelItineraryId}/preview|}" class="btn btn-info"> 🔍 預覽行程 </a>
        </div>
    </form>
</div>

<script th:inline="javascript">
/*<![CDATA[*/
    const allSceneries = /*[[${allSceneries}]]*/ {};
    const startDate = /*[[${startDate}]]*/ '2025-07-01';
    const endDate = /*[[${endDate}]]*/ '2025-07-07';
    let indexCounter = /*[[${#lists.size(dailyItineraryFormDTO.dailyItems)}]]*/ 0;

    function addNewRow() {
        const container = document.getElementById("itineraryItems");
        const newIndex = indexCounter++;

        let sceneryOptions = `<option value="">請選擇景點</option>`;
        for (const [id, name] of Object.entries(allSceneries)) {
            sceneryOptions += `<option value="${id}">${name}</option>`;
        }

        const newRow = document.createElement("div");
        newRow.classList.add("row", "mb-3", "border", "p-2", "itinerary-row");
        newRow.innerHTML = `
            <input type="hidden" name="dailyItems[${newIndex}].travelPlanDayId" />

            <label>景點：</label>
            <select name="dailyItems[${newIndex}].sceneryId" class="form-select" required onchange="updateSceneryName(this, ${newIndex})">
                ${sceneryOptions}
            </select>

            <label>景點名稱：</label>
            <input type="text" name="dailyItems[${newIndex}].sceneryName" class="form-control" readonly />

            <label>旅遊日期：</label>
            <input type="date" name="dailyItems[${newIndex}].traveltime" class="form-control" required min="${startDate}" max="${endDate}" />

            <label>行程順序：</label>
            <input type="number" name="dailyItems[${newIndex}].travelSequenceNumber" class="form-control" min="1" required />

            <div class="text-end mt-2">
                <button type="button" class="btn btn-danger btn-sm" onclick="removeRow(this)">🗑 刪除</button>
            </div>
        `;
        container.appendChild(newRow);
    }

    function removeRow(btn) {
        btn.closest(".itinerary-row").remove();
    }

    function clearAllRows() {
        document.getElementById("itineraryItems").innerHTML = "";
        indexCounter = 0;
    }

    function updateSceneryName(selectEl, index) {
        const sceneryId = selectEl.value;
        const input = document.querySelector(`input[name='dailyItems[${index}].sceneryName']`);
        input.value = allSceneries[sceneryId] || '';
    }
/*]]>*/
</script>
</body>
</html>
