<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant"
th:replace="~{layout :: layout (~{::title}, ~{::body}, ~{})}">
<head>
  <meta charset="UTF-8">
  <th:block th:fragment="title">新增每日行程</th:block>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h2>新增每日行程</h2>
  <p>
    旅程期間：
    <strong th:text="${startDate}">2025-07-01</strong> ~
    <strong th:text="${endDate}">2025-07-07</strong>
  </p>

  <div th:if="${errorMessage}" class="alert alert-danger">
    <p th:text="${errorMessage}"></p>
  </div>

  <form th:action="@{/admin/travelplans/{planId}/itinerary/{itineraryId}/days/save(planId=${travelPlanId}, itineraryId=${travelItineraryId})}" 
        method="post" 
        th:object="${dailyItineraryFormDTO}"   
        id="dailyForm">

    <input type="hidden" name="traveltime" th:value="${currentEditDate}" />

    <div id="itineraryItems">
      <div th:each="item, iterStat : *{dailyItems}" class="row mb-3 border p-2 itinerary-row">
        <input type="hidden" th:name="|dailyItems[${iterStat.index}].travelSequenceNumber|" th:value="${item.travelSequenceNumber}" />

        <label>景點：</label>
        <select th:name="|dailyItems[${iterStat.index}].sceneryId|" class="form-select" required>
          <option value="">請選擇景點</option>
          <option th:each="entry : ${allSceneries}" th:value="${entry.key}" th:text="${entry.value}" 
                  th:selected="${entry.key} == ${item.sceneryId}"></option>
        </select>

        <label>旅遊日期：</label>
        <input type="date"
               th:name="|dailyItems[${iterStat.index}].traveltime|"
               th:value="${item.traveltime}"
               class="form-control"
               required
               th:attr="min=${startDate}, max=${endDate}" />

        <div class="text-end mt-2">
          <button type="button" class="btn btn-danger btn-sm" onclick="removeRow(this)">🗑 刪除</button>
        </div>
      </div>
    </div>

    <div class="mt-3">
      <button type="submit" class="btn btn-success">💾 儲存行程</button>
      <button type="button" class="btn btn-secondary" onclick="addNewRow()">➕ 新增一行</button>
      <button type="button" class="btn btn-outline-danger" onclick="clearAllRows()">🧹 清除全部</button>
      <a th:href="@{|/admin/travelplans/${travelPlanId}/itinerary/${travelItineraryId}/days?date=${currentEditDate}|}" class="btn btn-outline-secondary ms-2">← 返回每日行程列表</a>
    </div>
  </form>
</div>

<script th:inline="javascript">
/*<![CDATA[*/
  const allSceneries = /*[[${allSceneries}]]*/ {};
  const startDate = /*[[${startDate}]]*/ '2025-07-01';
  const endDate = /*[[${endDate}]]*/ '2025-07-07';
  const currentEditDate = /*[[${currentEditDate}]]*/ '2025-07-01';
  let indexCounter = /*[[${#lists.size(dailyItineraryFormDTO.dailyItems)}]]*/ 1;

  function addNewRow() {
    const container = document.getElementById("itineraryItems");
    const newIndex = indexCounter++;

    let sceneryOptions = `<option value="">請選擇景點</option>`;
    for (const [id, name] of Object.entries(allSceneries)) {
      sceneryOptions += `<option value="${id}">${name}</option>`;
    }

    const newRow = document.createElement("div");
    newRow.classList.add("row", "mb-3", "border", "p-2", "itinerary-row");
    newRow.innerHTML = `
      <input type="hidden" name="dailyItems[${newIndex}].travelSequenceNumber" value="${newIndex}" />

      <label>景點：</label>
      <select name="dailyItems[${newIndex}].sceneryId" class="form-select" required>
        ${sceneryOptions}
      </select>

      <label>旅遊日期：</label>
      <input type="date" name="dailyItems[${newIndex}].traveltime" class="form-control" required min="${startDate}" max="${endDate}" value="${currentEditDate}" />

      <div class="text-end mt-2">
        <button type="button" class="btn btn-danger btn-sm" onclick="removeRow(this)">🗑 刪除</button>
      </div>
    `;
    container.appendChild(newRow);
  }

  function removeRow(btn) {
    btn.closest(".itinerary-row").remove();
  }

  function clearAllRows() {
    document.getElementById("itineraryItems").innerHTML = "";
    indexCounter = 0;
  }
/*]]>*/
</script>

</body>
</html>
