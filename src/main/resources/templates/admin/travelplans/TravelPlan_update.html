<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新增/編輯行程計畫</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <h2 class="mb-4 text-center" th:text="${travelPlan.travelPlanId != null} ? '✏️ 編輯行程計畫' : '➕ 新增行程計畫'">新增行程</h2>

  <form th:action="@{/admin/travelplans/save}" method="post" enctype="multipart/form-data">
    <input type="hidden" name="travelPlanId" th:value="${travelPlan.travelPlanId}"/>

    <div class="mb-3">
      <label for="title" class="form-label">行程標題</label>
      <input type="text" class="form-control" id="title" name="travelTitle" th:value="${travelPlan.travelTitle}" required>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">行程簡介</label>
      <textarea class="form-control" id="description" name="travelPlanDescription" rows="3" required
                th:text="${travelPlan.travelPlanDescription}"></textarea>
    </div>

    <div class="mb-3">
      <label for="banner" class="form-label">行程主圖</label>
      <input class="form-control" type="file" id="banner" name="bannerFile">
      <div class="mt-2" th:if="${travelPlan.travelPlanBannerUrl != null}">
        <p>目前圖片：</p>
        <img th:src="${travelPlan.travelPlanBannerUrl}" style="height: 100px">
      </div>
    </div>

    <div class="text-center mt-4">
      <button type="submit" class="btn btn-primary">💾 儲存</button>
      <a th:href="@{/admin/travelplans}" class="btn btn-secondary ms-2">返回清單</a>
    </div>
  </form>
</div>
</body>
</html>
