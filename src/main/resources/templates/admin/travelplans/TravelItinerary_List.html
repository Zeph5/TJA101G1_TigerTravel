<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>梯次管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <h2 class="mb-4 text-center">📆 梯次管理</h2>

  <div class="mb-3 text-end">
    <a class="btn btn-success" th:href="@{'/admin/travelplans/' + ${travelPlanId} + '/itinerary/add'}">➕ 新增梯次</a>
  </div>

  <table class="table table-bordered table-hover">
    <thead class="table-light">
      <tr>
        <th>出發日期</th>
        <th>結束日期</th>
        <th>人數上限</th>
        <th>總金額</th>
        <th>建立時間</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="itinerary : ${itineraryList}">
        <td th:text="${itinerary.startDate}">2025-08-01</td>
        <td th:text="${itinerary.endDate}">2025-08-05</td>
        <td th:text="${itinerary.maxTourist}">20</td>
        <td th:text="${itinerary.totalPrice}">$35,000</td>
        <td th:text="${#temporals.format(itinerary.publishedDate, 'yyyy-MM-dd HH:mm')}">2025-07-01 12:00</td>
        <td>
          <a class="btn btn-sm btn-primary me-1" th:href="@{'/admin/itinerary/' + ${itinerary.travelItineraryId} + '/edit'}">編輯</a>
          <a class="btn btn-sm btn-secondary me-1" th:href="@{'/admin/itinerary/' + ${itinerary.travelItineraryId} + '/days'}">日程</a>
          <a class="btn btn-sm btn-danger" th:href="@{'/admin/itinerary/' + ${itinerary.travelItineraryId} + '/delete'}" onclick="return confirm('確定要刪除這個梯次嗎？')">刪除</a>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="text-center mt-4">
    <a th:href="@{/admin/travelplans}" class="btn btn-secondary">返回行程管理</a>
  </div>
</div>
</body>
</html>
