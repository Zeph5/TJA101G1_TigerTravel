<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>建立/編輯行程梯次</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />

  <!-- 自訂美化 -->
  <style>
    body {
      background: #f6f8fa;
      font-family: 'Segoe UI', sans-serif;
      padding: 40px 10px;
    }

    .container {
      background: #fffefc;
      max-width: 640px;
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      border: 1px solid #e3e3e3;
    }

    h2 {
      font-size: 1.75rem;
      font-weight: 600;
      color: #2f3e46;
      margin-bottom: 30px;
      text-align: center;
    }

    label {
      font-weight: 600;
      color: #495057;
    }

    .form-control {
      border-radius: 8px;
      border: 1px solid #ced4da;
    }

    .form-control:focus {
      border-color: #80bdff;
      box-shadow: 0 0 0 0.1rem rgba(0, 123, 255, 0.25);
    }

    .form-text {
      color: #6c757d;
    }

    .error-message {
      color: #d9534f;
      font-size: 0.875rem;
    }

    .btn-primary {
      background-color: #457b9d;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1.5rem;
    }

    .btn-primary:hover {
      background-color: #355c7d;
    }

    .btn-secondary {
      background-color: #adb5bd;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1.5rem;
    }

    .btn-secondary:hover {
      background-color: #6c757d;
    }

    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-top: 40px;
    }

    @media (max-width: 576px) {
      .btn-group {
        flex-direction: column;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 th:text="${travelItineraryDTO.travelItineraryId == null} ? '建立行程梯次 - 步驟 2' : '編輯行程梯次 - 步驟 2'"></h2>

    <form th:action="${travelItineraryDTO.travelItineraryId == null} ?
      @{/admin/travelplans/{planId}/itinerary/save(planId=${travelPlanId})} :
      @{/admin/travelplans/{planId}/itinerary/{itineraryId}/update(planId=${travelPlanId}, itineraryId=${travelItineraryDTO.travelItineraryId})}"
      th:object="${travelItineraryDTO}" method="post">

      <input type="hidden" th:field="*{travelPlanId}" />
      <input type="hidden" th:field="*{travelItineraryId}" />
      
            <!-- 開始日期 -->
      <div class="form-group">
        <label for="startDate">梯次開始日期</label>
        <input type="date" id="startDate" th:field="*{startDate}" class="form-control" required />
        <small class="form-text">請選擇此梯次的開始日期。</small>
        <p th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="error-message"></p>
      </div>

      <!-- 結束日期 -->
      <div class="form-group">
        <label for="endDate">梯次結束日期</label>
        <input type="date" id="endDate" th:field="*{endDate}" class="form-control" required />
        <small class="form-text">請選擇此梯次的結束日期。</small>
        <p th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" class="error-message"></p>
      </div>
      

      <!-- 最大旅客數 -->
      <div class="form-group">
        <label for="maxTourist">最大旅客數</label>
        <input type="number" id="maxTourist" th:field="*{maxTourist}" class="form-control" min="1" required />
        <small class="form-text">請輸入此梯次的最大旅客容納人數。</small>
        <p th:if="${#fields.hasErrors('maxTourist')}" th:errors="*{maxTourist}" class="error-message"></p>
      </div>

      <!-- 價格 -->
      <div class="form-group">
        <label for="totalPrice">總價 (每人)</label>
        <input type="number" step="0.01" id="totalPrice" th:field="*{totalPrice}" class="form-control" min="0" required />
        <small class="form-text">請輸入此梯次的每人費用。</small>
        <p th:if="${#fields.hasErrors('totalPrice')}" th:errors="*{totalPrice}" class="error-message"></p>
      </div>


      <!-- 按鈕群 -->
      <div class="btn-group">
        <a th:href="@{/admin/travelplans/{planId}/itinerary(planId=${travelPlanId})}" class="btn btn-secondary">返回列表</a>
        <button type="submit" class="btn btn-primary" th:text="${travelItineraryDTO.travelItineraryId == null} ? '新增梯次' : '更新梯次'"></button>
      </div>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
