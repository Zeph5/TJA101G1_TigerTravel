<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建立/編輯行程梯次 - 步驟 2</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
            padding: 30px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #343a40;
        }
        .form-group label {
            font-weight: bold;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>建立/編輯行程梯次 - 步驟 2</h2>

        <form th:action="@{/admin/travelplans/itineraries/save}" th:object="${travelItineraryDTO}" method="post">

            <input type="hidden" th:field="*{travelPlanId}" />
            <input type="hidden" th:field="*{travelItineraryId}" />

            <div class="form-group">
                <label for="maxTourist">最大旅客數:</label>
                <input type="number" id="maxTourist" th:field="*{maxTourist}" class="form-control"
                       min="1" required aria-describedby="maxTouristHelp">
                <small id="maxTouristHelp" class="form-text text-muted">請輸入此梯次的最大旅客容納人數。</small>
                <p th:if="${#fields.hasErrors('maxTourist')}" th:errors="*{maxTourist}" class="error-message"></p>
            </div>

            <div class="form-group">
                <label for="totalPrice">總價 (每人):</label>
                <input type="number" step="0.01" id="totalPrice" th:field="*{totalPrice}" class="form-control"
                       min="0" required aria-describedby="totalPriceHelp">
                <small id="totalPriceHelp" class="form-text text-muted">請輸入此梯次的每人費用。</small>
                <p th:if="${#fields.hasErrors('totalPrice')}" th:errors="*{totalPrice}" class="error-message"></p>
            </div>

            <div class="form-group">
                <label for="startDate">梯次開始日期:</label>
                <input type="date" id="startDate" th:field="*{startDate}" class="form-control" required
                       aria-describedby="startDateHelp">
                <small id="startDateHelp" class="form-text text-muted">請選擇此梯次的開始日期。</small>
                <p th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="error-message"></p>
            </div>

            <div class="form-group">
                <label for="endDate">梯次結束日期:</label>
                <input type="date" id="endDate" th:field="*{endDate}" class="form-control" required
                       aria-describedby="endDateHelp">
                <small id="endDateHelp" class="form-text text-muted">請選擇此梯次的結束日期。</small>
                <p th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" class="error-message"></p>
            </div>

            <div class="btn-group">
                <a th:href="@{/admin/travelplans/list}" class="btn btn-secondary">返回旅行計畫列表</a>
                <button type="submit" class="btn btn-primary">儲存梯次資訊</button>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
