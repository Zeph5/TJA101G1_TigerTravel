<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>行程梯次編輯表單</title>
<style>
    label {
        display: inline-block;
        width: 120px;
        margin-top: 10px;
    }
    input, textarea {
        width: 250px;
        margin-top: 10px;
    }
    .error {
        color: red;
    }
    .form-row {
        margin-bottom: 10px;
    }
    button {
        margin-top: 15px;
        padding: 5px 10px;
    }
</style>
</head>
<body>

<h2>行程梯次編輯表單</h2>

<!-- 
  表單 action 指向 Controller 的 POST /save 路徑，記得替換 planId 
  th:object 綁定 TravelItineraryDTO
-->

      <form th:action="@{'/admin/travelplans/' + ${travelPlanId} + '/itinerary/save'}" 
      th:object="${travelItineraryDTO}" method="post" enctype="multipart/form-data">

    <div class="form-row">
        <label>行程梯次ID:</label>
        <input type="text" th:field="*{travelItineraryId}" readonly="readonly" />
    </div>

    <div class="form-row">
        <label>開始日期:</label>
        <input type="date" th:field="*{startDate}" />
        <div th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="error"></div>
    </div>

    <div class="form-row">
        <label>結束日期:</label>
        <input type="date" th:field="*{endDate}" />
        <div th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" class="error"></div>
    </div>

    <div class="form-row">
        <label>最大旅客數:</label>
        <input type="number" th:field="*{maxTourist}" min="1" />
        <div th:if="${#fields.hasErrors('maxTourist')}" th:errors="*{maxTourist}" class="error"></div>
    </div>

    <div class="form-row">
        <label>總價:</label>
        <input type="number" step="0.01" th:field="*{totalPrice}" />
        <div th:if="${#fields.hasErrors('totalPrice')}" th:errors="*{totalPrice}" class="error"></div>
    </div>

    <!-- 這裡也可以加上 travelPlanId 隱藏欄位，確保送出時有關聯ID -->
    <input type="hidden" th:field="*{travelPlanId}" />
    
    <div>
        <button type="submit">送出修改</button>
    </div>

</form>

</body>
</html>
