<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<link href="/css/admin-theme.css" rel="stylesheet">
<title>所有行程資料</title>

<!-- Bootstrap 5 -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet" />

<!-- DataTables -->
<link rel="stylesheet"
	href="https://cdn.datatables.net/1.13.5/css/dataTables.bootstrap5.min.css" />
<script src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script
	src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
<script
	src="https://cdn.datatables.net/1.13.5/js/dataTables.bootstrap5.min.js"></script>

<style>
body {
	background-color: #f8f9fa;
	padding: 2rem 5%;
}

.card {
	box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
	border-radius: 0.75rem;
}

table th {
	background-color: #e3f2fd;
}

.btn-group-sm .btn {
	margin-right: 0.25rem;
}
</style>

<script>
	$(document).ready(function() {
		$('#itineraryTable').DataTable({
			lengthMenu : [ 5, 10, 20, 50 ],
			language : {
				processing : "處理中...",
				loadingRecords : "載入中...",
				lengthMenu : "顯示 _MENU_ 筆結果",
				zeroRecords : "沒有符合的結果",
				info : "顯示第 _START_ 至 _END_ 筆結果，共 _TOTAL_ 筆",
				infoEmpty : "顯示第 0 至 0 筆結果，共 0 筆",
				infoFiltered : "(從 _MAX_ 筆結果中過濾)",
				search : "搜尋:",
				paginate : {
					first : "第一頁",
					previous : "上一頁",
					next : "下一頁",
					last : "最後一頁"
				}
			}
		});
	});
</script>
</head>

<body>
	<div class="container">
		<!-- ✅ 新增：整個 header 排版 -->
<div class="position-relative mb-4">
  <!-- 標題置中 -->
  <h2 class="fw-bold text-primary text-center">
    <i class="bi bi-calendar2-week-fill"></i> 行程梯次總覽
  </h2>

  <!-- 回首頁按鈕在右上角 -->
  <a th:href="@{/manager/home}" class="btn btn-outline-primary position-absolute top-0 end-0">
    🏠 回首頁
  </a>
</div>

<!-- ✅ 「新增行程」獨立一行靠右 -->
<div class="text-end mb-4">
  <a th:href="@{/admin/travelplans/{planId}/itinerary/new(planId=${planId})}" class="btn btn-success">
    <i class="bi bi-plus-circle"></i> 新增行程
  </a>
</div>


		<!-- 🔽 分群區塊 -->
		<div th:each="entry : ${groupedItineraries}" class="card mb-5">
			<div class="card-header bg-light">
				<h5 class="mb-0">
					🌴 <span th:text="${entry.key.travelTitle}">計畫名稱</span>
				</h5>
			</div>
			<div class="card-body p-0">
				<div class="table-responsive">
					<table class="table table-hover align-middle text-center mb-0">
						<thead>
							<tr>
								<th>編號</th>
								<th>出發日</th>
								<th>結束日</th>
								<th>團位</th>
								<th>價格</th>
								<th>發布日期</th>
								<th>最後修改</th>
								<th>操作</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="itinerary : ${entry.value}">
								<td th:text="${itinerary.travelItineraryId}">15</td>
								<!-- 🔼 新增 -->
								<td
									th:text="${#temporals.format(itinerary.startDate, 'M/d (E)', 'Asia/Taipei')}">8/7
									(四)</td>
								<td
									th:text="${#temporals.format(itinerary.endDate, 'M/d (E)', 'Asia/Taipei')}">8/10
									(日)</td>
								<td th:text="${itinerary.maxTourist}">30</td>
								<td class="text-success fw-bold"
									th:text="'$' + ${itinerary.totalPrice}">$36500</td>
								<td
									th:text="${#temporals.format(itinerary.publishedDate, 'yyyy-MM-dd')}">2025-07-01</td>
								<td
									th:text="${#temporals.format(itinerary.lastModifiedDate, 'yyyy-MM-dd')}">2025-07-03</td>
								<td>
									<div class="btn-group btn-group-sm">
										<a
											th:href="@{'/admin/travelplans/' + ${itinerary.travelPlan.travelPlanId} + '/itinerary/' + ${itinerary.travelItineraryId} + '/edit'}"
											class="btn btn-outline-primary">編輯</a> <a
											th:href="@{'/admin/travelplans/' + ${itinerary.travelPlan.travelPlanId} + '/itinerary/' + ${itinerary.travelItineraryId} + '/days'}"
											class="btn btn-outline-secondary">詳情</a> <a
											th:href="@{'/admin/itinerary/delete/' + ${itinerary.travelItineraryId}}"
											onclick="return confirm('確定刪除嗎？')"
											class="btn btn-outline-danger">刪除</a>
									</div>
								</td>
							</tr>
						</tbody>

					</table>
				</div>
			</div>
		</div>

		<!-- 🔽 返回按鈕 -->
		<div class="text-end">
			<a th:href="@{/admin/travelplans}" class="btn btn-secondary"> <i
				class="bi bi-arrow-left"></i> 返回計畫列表
			</a>
		</div>
	</div>

	<!-- Bootstrap Icons -->
	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
		rel="stylesheet" />
</body>
</html>
