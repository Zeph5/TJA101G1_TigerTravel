<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行程管理首頁</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <h1 class="mb-4 text-center">📋 行程管理</h1>

  <div class="text-end mb-3">
    <a class="btn btn-success" th:href="@{/admin/travelplans/new}">➕ 新增行程計畫</a>
  </div>

  <table class="table table-bordered">
    <thead class="table-light">
    <tr>
      <th>行程標題</th>
      <th>主圖</th>
      <th>簡介</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="plan : ${travelPlans}">
      <td th:text="${plan.travelTitle}">日月潭之旅</td>
      <td><img th:src="${plan.travelPlanBannerUrl}" style="height: 50px"></td>
      <td th:text="${plan.travelPlanDescription}">經典山湖路線...</td>
      <td>
        <a th:href="@{'/admin/travelplans/edit/' + ${plan.travelPlanId}}" class="btn btn-sm btn-outline-primary">編輯</a>
        <a th:href="@{'/admin/travelplans/' + ${plan.travelPlanId} + '/itineraries'}" class="btn btn-sm btn-outline-secondary">設定梯次</a>
        <a th:href="@{'/admin/travelplans/delete/' + ${plan.travelPlanId}}" class="btn btn-sm btn-outline-danger" onclick="return confirm('確定要刪除這個計畫嗎？')">刪除</a>
      </td>
    </tr>
    <tr th:if="${#lists.isEmpty(travelPlans)}">
      <td colspan="4" class="text-center">目前無資料</td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
