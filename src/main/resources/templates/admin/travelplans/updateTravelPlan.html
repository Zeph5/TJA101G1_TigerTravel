<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>旅行計畫更新表單</title>
    <style>
        label {
            display: inline-block;
            width: 120px;
            margin-top: 10px;
        }
        input, textarea {
            width: 250px;
            margin-top: 10px;
        }
        .error {
            color: red;
        }
        .form-row {
            margin-bottom: 10px;
        }
        button {
            margin-top: 15px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>

<h2>旅行計畫更新表單</h2>

<form th:action="@{/travelplan/update}" th:object="${travelPlanPreviewDTO}" method="post" enctype="multipart/form-data">

    <div class="form-row">
        <label>旅行計畫ID:</label>
        <input type="text" th:field="*{travelPlanId}" readonly="readonly" />
    </div>

    <div class="form-row">
        <label>旅行標題:</label>
        <input type="text" th:field="*{travelTitle}" />
        <div th:if="${#fields.hasErrors('travelTitle')}" th:errors="*{travelTitle}" class="error"></div>
    </div>

    <div class="form-row">
        <label>旅行描述:</label>
        <textarea th:field="*{travelPlanDescription}" rows="4"></textarea>
        <div th:if="${#fields.hasErrors('travelPlanDescription')}" th:errors="*{travelPlanDescription}" class="error"></div>
    </div>

    

    <div>
        <button type="submit">送出修改</button>
    </div>

</form>

</body>
</html>
