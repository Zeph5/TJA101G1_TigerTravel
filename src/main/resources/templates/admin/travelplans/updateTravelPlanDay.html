<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>編輯每日行程</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>編輯每日行程</h2>

    <form th:action="@{/admin/travelplans/{planId}/itinerary/{itineraryId}/days/update(planId=${travelPlanId}, itineraryId=${travelItineraryId})}"
      method="post"
      th:object="${travelPlanDayDTO}"
      class="needs-validation"
      novalidate>


        <input type="hidden" th:field="*{travelPlanDayId}" />

        <div class="mb-3">
            <label class="form-label">景點：</label>
            <select th:field="*{sceneryId}" class="form-select" required>
                <option value="">請選擇景點</option>
                <option th:each="entry : ${allSceneries}"
                        th:value="${entry.key}"
                        th:text="${entry.value}"
                        th:selected="${entry.key} == *{sceneryId}">
                </option>
            </select>
            <div class="invalid-feedback">請選擇一個景點</div>
        </div>

        <div class="mb-3">
            <label class="form-label">景點名稱：</label>
            <input type="text" th:field="*{sceneryName}" class="form-control" readonly />
        </div>

        <div class="mb-3">
            <label class="form-label">旅行日期：</label>
            <input type="date" th:field="*{traveltime}" class="form-control" required />
            <div class="invalid-feedback">請選擇旅行日期</div>
        </div>
        

        <div class="mb-3">
            <label class="form-label">行程順序：</label>
            <input type="number" th:field="*{travelSequenceNumber}" class="form-control" min="1" required />
            <div class="invalid-feedback">請輸入行程順序</div>
        </div>

        <button type="submit" class="btn btn-success">💾 更新</button>
        <a th:href="@{/admin/travelplans/{planId}/itinerary/{itineraryId}/days(planId=${travelPlanId}, itineraryId=${travelItineraryId})}" class="btn btn-secondary">返回列表</a>
    </form>
</div>

<script>
    // Bootstrap 驗證樣板
    (function () {
        'use strict';
        window.addEventListener('load', function () {
            const forms = document.getElementsByClassName('needs-validation');
            Array.prototype.filter.call(forms, function (form) {
                form.addEventListener('submit', function (event) {
                    if (form.checkValidity() === false) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        }, false);
    })();
</script>
</body>
</html>
